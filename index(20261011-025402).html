/* Dropdown Settings dan profil proktor */
.settings-nav-wrap{position:relative}
.settings-nav-toggle{justify-content:flex-start}
.settings-nav-toggle .nav-chevron{margin-left:auto;width:13px;height:13px;transition:transform .18s}
.settings-nav-toggle[aria-expanded="true"] .nav-chevron{transform:rotate(180deg)}
.settings-subnav{display:flex;flex-direction:column;gap:4px;margin:3px 0 5px 20px;padding-left:10px;border-left:1px solid #ffffff26}
.nav-subitem{display:flex;align-items:center;gap:9px;width:100%;border:0;text-align:left;background:transparent;color:#bbcae0;padding:10px 11px;border-radius:9px;font-size:12px;font-weight:650}
.nav-subitem svg{width:14px;height:14px;flex:none}
.nav-subitem:hover{background:#ffffff10;color:#fff}
.nav-subitem.active{background:#2e5590;color:#fff;box-shadow:inset 2px 0 #8ab4ff}
.profile-menu-wrap{position:relative}
.profile.profile-trigger{border:0;background:transparent;color:inherit;text-align:left;cursor:pointer;padding:5px 0 5px 13px}
.profile.profile-trigger:hover .profile-name{color:var(--blue)}
.profile-trigger .profile-name,.profile-trigger .profile-role{display:block}
.profile-chevron{width:13px;height:13px;color:#7a879b;transition:transform .18s;margin-left:2px}
.profile-trigger[aria-expanded="true"] .profile-chevron{transform:rotate(180deg)}
.profile-dropdown{position:absolute;top:calc(100% + 10px);right:0;min-width:190px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:6px;box-shadow:0 14px 35px #17203320;z-index:60}
.profile-dropdown button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:11px 12px;border-radius:9px;text-align:left;color:#27354b;font-weight:700;font-size:12px}
.profile-dropdown button svg{width:16px;height:16px;color:#64748b}
.profile-dropdown button:hover{background:#f2f6fd;color:var(--blue)}
.profile-dropdown .dropdown-danger{color:var(--red)}
.profile-dropdown .dropdown-danger svg{color:var(--red)}
.profile-dropdown-divider{height:1px;background:var(--line);margin:5px 3px}
.profile-photo-preview{width:70px;height:70px;border-radius:22px;font-size:22px}
.profile-photo-preview img,.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.profile-photo-row{display:flex;align-items:center;gap:15px;padding:4px 0 8px}
.profile-photo-meta{display:flex;flex-direction:column;gap:5px}
.profile-photo-meta strong{font-size:13px}
.profile-photo-meta span{font-size:11px;color:var(--muted);line-height:1.5}
@media(max-width:700px){.profile-dropdown{right:0;min-width:175px}.profile-photo-preview{width:62px;height:62px;border-radius:19px}}


/* Polished confirmation dialogs and result bulk actions */
.confirm-modal{width:min(510px,100%);border:1px solid #e8edf5}
.confirm-hero{display:flex;align-items:flex-start;gap:15px;padding:22px 23px 18px}
.confirm-icon{height:52px;width:52px;flex:0 0 52px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#fff1f1,#ffe2e5);color:#bd3445;box-shadow:inset 0 0 0 1px #ffcbd1}
.confirm-icon.neutral{background:linear-gradient(145deg,#eaf2ff,#dce8ff);color:#2556a4;box-shadow:inset 0 0 0 1px #d0dfff}
.confirm-icon svg{width:22px;height:22px}
.confirm-kicker{font-size:10px;text-transform:uppercase;letter-spacing:1.15px;font-weight:900;color:#b43b4a;margin:1px 0 7px}
.confirm-modal .modal-head h2{font-size:20px;letter-spacing:-.4px;line-height:1.3}
.confirm-modal .modal-head p{font-size:12px;line-height:1.6}
.confirm-copy{padding:0 23px 20px;color:#526078;font-size:13px;line-height:1.7}
.confirm-detail{margin-top:13px;padding:12px 13px;border:1px solid #f5d8dc;background:#fff7f7;border-radius:12px;color:#87404b;font-size:11px;line-height:1.6;display:flex;gap:9px;align-items:flex-start}
.confirm-detail svg{width:16px;height:16px;flex:none;margin-top:2px}
.confirm-phrase{padding:0 23px 18px}
.confirm-phrase label{display:block;font-weight:800;font-size:11px;color:#344259;margin-bottom:7px}
.confirm-phrase input{width:100%;height:43px;border:1px solid #dce3ed;border-radius:10px;padding:10px 12px;outline:none;font-weight:800;letter-spacing:1.2px}
.confirm-phrase input:focus{border-color:#e18a94;box-shadow:0 0 0 3px #ffe8eb}
.confirm-phrase .hint{font-size:10px;color:#7b879b;margin-top:7px}
.confirm-phrase .hint.invalid{color:#bd3445;font-weight:800}
.confirm-modal .modal-foot{padding:15px 23px 20px;border-top:0}
.confirm-modal .btn{min-width:118px}
.result-check{width:16px;height:16px;accent-color:#2563eb;cursor:pointer;vertical-align:middle}
.result-select-head{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;text-transform:none;letter-spacing:0;font-size:10px;color:#596981;cursor:pointer}
#deleteSelectedResults:disabled{opacity:.45;cursor:not-allowed;transform:none}
@media(max-width:600px){.confirm-hero{padding:18px 18px 14px;gap:12px}.confirm-copy{padding:0 18px 17px}.confirm-phrase{padding:0 18px 16px}.confirm-modal .modal-foot{padding:13px 18px 18px}.confirm-icon{height:45px;width:45px;flex-basis:45px;border-radius:14px}.confirm-modal .modal-foot .btn{flex:1;min-width:0}}


/* Exam integrity monitoring: browser-limited visibility warnings and proctor alerts */
.integrity-overlay{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(8,18,38,.82);backdrop-filter:blur(8px)}
.integrity-dialog{width:min(520px,100%);background:#fff;border:1px solid #ffd2d5;border-radius:22px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.35);animation:integrity-pop .18s ease-out}
.integrity-stripe{height:6px;background:linear-gradient(90deg,#b91c1c,#ef4444,#fb923c)}
.integrity-dialog-body{padding:26px 28px 24px;text-align:center}
.integrity-symbol{width:66px;height:66px;margin:0 auto 16px;display:grid;place-items:center;border-radius:22px;background:#fff0f0;color:#c62839;box-shadow:inset 0 0 0 1px #ffd1d5}
.integrity-symbol svg{width:29px;height:29px}
.integrity-eyebrow{font-size:10px;font-weight:900;letter-spacing:1.5px;color:#b42332;text-transform:uppercase}
.integrity-dialog h2{font-size:23px;letter-spacing:-.5px;margin:8px 0 10px;color:#15233b}
.integrity-dialog p{font-size:13px;line-height:1.7;color:#5b6679;margin:0 auto;max-width:410px}
.integrity-countdown{display:flex;align-items:center;justify-content:center;width:88px;height:88px;border:5px solid #fee2e2;border-top-color:#dc2626;border-radius:50%;margin:22px auto 12px;font-size:35px;font-weight:900;letter-spacing:-1px;color:#b42332;font-variant-numeric:tabular-nums}
.integrity-warning-note{font-size:11px!important;color:#8e3540!important;background:#fff6f6;border:1px solid #ffdee1;border-radius:12px;padding:10px 12px;margin-top:16px!important}
.integrity-alert-list{display:grid;gap:10px}
.integrity-alert-item{display:flex;align-items:flex-start;gap:13px;border:1px solid #e6ebf3;background:#fff;border-radius:14px;padding:14px}
.integrity-alert-symbol{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;background:#fff0f0;color:#bc2435}
.integrity-alert-symbol svg{width:20px;height:20px}
.integrity-alert-main{min-width:0;flex:1}
.integrity-alert-main strong{font-size:13px;color:#1c2a40;display:block;margin-bottom:4px}
.integrity-alert-main p{font-size:11px;color:#66758c;line-height:1.6;margin:0}
.integrity-alert-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.integrity-empty{padding:32px 18px;border:1px dashed #d6deea;border-radius:15px;text-align:center;color:#6b7890}
.integrity-empty svg{width:28px;height:28px;margin-bottom:8px;color:#7b8ba4}

function esc(v=''){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(prefix='ID'){return prefix+'-'+(globalThis.crypto?.randomUUID?.()||Math.random().toString(36).slice(2)+Date.now().toString(36)).replace(/[^a-zA-Z0-9-]/g,'').slice(0,15);}
function todayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fmtDate(v,opts={day:'2-digit',month:'short',year:'numeric'}){if(!v)return '-';const d=new Date(v.length===10?v+'T00:00:00':v);return Number.isNaN(d.getTime())?v:d.toLocaleDateString('id-ID',opts)}
function fmtTime(v){if(!v)return '-';return new Date(v).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}
function initials(name='Siswa'){return name.trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'S'}
function randToken(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<7;i++)s+=chars[Math.floor(Math.random()*chars.length)];return s;}

const questions={"Bahasa Indonesia":[{"type":"single","prompt":"Simpulan yang paling kuat berdasarkan teks tersebut adalah …","options":["Program kebun kota pasti menyelesaikan seluruh persoalan pangan perkotaan.","Kebun kota hanya layak dikembangkan oleh warga yang memiliki halaman luas.","Kebun kota berpotensi memperkuat ketahanan pangan jika disertai pendampingan dan pembagian akses yang adil.","Pemerintah sebaiknya menghentikan seluruh pembangunan perumahan baru.","Keberhasilan kebun kota cukup diukur dari jumlah foto panen yang diunggah warga."],"correct":[2],"stimulus":"Dalam tiga tahun terakhir, Kelurahan Puspa mengubah beberapa lahan kosong menjadi kebun bersama. Warga memanen sayuran untuk konsumsi keluarga dan menjual sebagian hasilnya. Namun, laporan pengelola menunjukkan hasil panen tidak merata karena jadwal perawatan bertabrakan, akses air terbatas, dan sebagian warga belum memahami teknik pengomposan. Tim kelurahan mengusulkan pelatihan berkala serta jadwal penggunaan lahan yang disepakati bersama. Peneliti yang diwawancarai mengingatkan bahwa kebun komunitas bukan pengganti sistem distribusi pangan, melainkan salah satu cara memperkuat daya tahan lingkungan.","illustration":{"kind":"quote","title":"Cuplikan laporan kelurahan","lines":["3 kebun bersama dikelola warga","Air terbatas pada musim kemarau","Pelatihan kompos belum menjangkau semua kelompok"],"caption":"Data lapangan memperlihatkan manfaat sekaligus kendala pelaksanaan."}},{"type":"multi","prompt":"Pilih SEMUA pernyataan yang dapat disimpulkan secara logis dari teks.","options":["Pelatihan pengomposan berpotensi membantu mengatasi sebagian kendala kebun.","Kebun komunitas telah membuat semua keluarga tidak lagi membeli pangan.","Pengaturan jadwal merupakan salah satu kebutuhan pengelolaan kebun.","Peneliti menganggap kebun kota sama sekali tidak bermanfaat.","Ketersediaan air dapat memengaruhi hasil panen."],"correct":[0,2,4],"stimulus":"Bacalah kembali laporan Kelurahan Puspa. Penulis membedakan manfaat program dari keterbatasan pelaksanaannya. Tidak ada pernyataan bahwa program sudah memenuhi seluruh kebutuhan pangan warga; yang dijelaskan ialah potensi kebun dan kendala yang masih perlu diatasi. Pilih simpulan yang didukung informasi, bukan yang sekadar mungkin terjadi.","illustration":{"kind":"flow","title":"Masalah yang tercatat","items":["Jadwal bertabrakan","Air terbatas","Pelatihan belum merata"],"caption":"Ketiga faktor ini disebut sebagai kendala, bukan bukti kegagalan total."}},{"type":"single","prompt":"Kalimat yang paling efektif untuk menggantikan kalimat terakhir laporan tersebut adalah …","options":["Para peneliti mengatakan bahwasanya kebun komunitas itu merupakan salah satu cara untuk dapat meningkatkan ketahanan lingkungan.","Peneliti mengingatkan bahwa kebun komunitas dapat memperkuat ketahanan lingkungan, tetapi tidak menggantikan sistem distribusi pangan.","Menurut peneliti, kebun komunitas yang mana fungsinya adalah untuk memperkuat lingkungan dan bukan sebagai pengganti distribusi.","Peneliti mengingatkan tentang kebun komunitas yang merupakan sebuah cara di dalam rangka untuk memperkuat daya tahan lingkungan.","Peneliti menyebut kebun komunitas, yaitu suatu program yang pada dasarnya memiliki manfaat dan juga berbagai macam keterbatasan."],"correct":[1],"stimulus":"Seorang penyunting diminta memperbaiki laporan kebun kota tanpa mengubah makna. Kalimat hasil suntingan harus hemat kata, tidak rancu, tetap menyatakan dua gagasan utama, dan menjaga hubungan pertentangan antara manfaat kebun komunitas dengan keterbatasan fungsinya.","illustration":null},{"type":"single","prompt":"Manakah bukti yang PALING relevan untuk mendukung pendapat bahwa keberhasilan program bukan hanya ditentukan oleh luas lahan?","options":["Foto kebun dipasang di papan informasi kelurahan.","Warga menyukai warna pagar yang digunakan.","Catatan menunjukkan hasil panen berbeda karena jadwal perawatan, akses air, dan keterampilan warga.","Kelurahan memiliki nama program yang mudah diingat.","Beberapa pengunjung datang saat panen raya."],"correct":[2],"stimulus":"Dalam rapat evaluasi, seorang pengurus berpendapat bahwa kebun yang lebih luas pasti menghasilkan manfaat lebih besar. Pengurus lain menolak kesimpulan tersebut karena keberhasilan juga ditentukan oleh cara lahan dirawat, ketersediaan sarana, dan kemampuan pengelola. Anda diminta memilih data paling kuat untuk menguji pendapat pertama.","illustration":{"kind":"table","title":"Ringkasan evaluasi dua petak","headers":["Petak","Luas","Hasil panen per m²"],"rows":[["A","120 m²","2,4 kg"],["B","80 m²","3,1 kg"]],"caption":"Luas yang lebih besar tidak otomatis berarti produktivitas per meter persegi lebih tinggi."}},{"type":"single","prompt":"Sebuah tajuk berita berbunyi “Kebun Kota Gagal Total, Warga Tetap Membeli Sayur”. Penilaian editorial paling tepat terhadap tajuk itu adalah …","options":["Tajuk netral karena menyebut dua informasi sekaligus.","Tajuk cenderung berlebihan karena satu fakta pembelian sayur tidak membuktikan program gagal total.","Tajuk pasti benar sebab semua warga kota harus membeli sayur.","Tajuk merupakan simpulan ilmiah karena memakai kata “total”.","Tajuk tidak dapat dinilai karena berita tidak memerlukan bukti."],"correct":[1],"stimulus":"Media lokal melaporkan sebagian warga masih membeli sayur meskipun ikut mengelola kebun bersama. Dalam isi berita, warga menjelaskan bahwa kebun belum menghasilkan semua jenis sayuran dan panen dilakukan bergiliran. Editor harus menilai apakah tajuk menggambarkan isi berita secara proporsional atau justru mengubah temuan terbatas menjadi kesimpulan mutlak.","illustration":null},{"type":"multi","prompt":"Pilih SEMUA kalimat yang tergolong fakta dan dapat diverifikasi.","options":["Kelurahan mengubah tiga lahan kosong menjadi kebun bersama.","Program ini merupakan inovasi paling membanggakan di seluruh provinsi.","Catatan panen menunjukkan hasil petak A sebesar 288 kg dalam satu periode.","Kebun bersama pasti menjadi kegiatan paling menyenangkan bagi semua warga.","Jadwal perawatan dicatat dalam lembar kerja pengelola."],"correct":[0,2,4],"stimulus":"Dalam laporan evaluasi, penulis perlu membedakan fakta dari penilaian subjektif. Fakta dapat diperiksa melalui catatan, pengukuran, atau dokumentasi yang relevan. Pernyataan yang menggunakan kata superlatif atau menggeneralisasi perasaan semua orang tidak otomatis menjadi fakta hanya karena dimuat dalam laporan.","illustration":null},{"type":"single","prompt":"Perhatikan hubungan antarkalimat berikut. Konjungsi yang paling tepat untuk menghubungkan kalimat “Panen meningkat pada bulan pertama. …, hasil turun ketika saluran air tersumbat” adalah …","options":["Oleh karena itu","Meskipun demikian","Selain itu","Bahkan","Dengan demikian"],"correct":[1],"stimulus":"Dalam menyunting laporan, konjungsi harus menunjukkan hubungan logis yang benar. Kalimat pertama menyampaikan kondisi positif, sedangkan kalimat kedua menunjukkan perubahan yang berlawanan karena muncul kendala baru. Konjungsi yang dipilih tidak boleh menyatakan sebab-akibat yang tidak didukung atau menambahkan informasi setara.","illustration":null},{"type":"single","prompt":"Fungsi paragraf kedua dalam teks laporan kebun kota terutama adalah …","options":["Menyajikan konflik antartokoh dalam sebuah cerita.","Mengulang judul agar pembaca mengingat topik.","Memberikan rincian kendala yang membatasi manfaat program.","Menghibur pembaca dengan pengalaman lucu warga.","Menawarkan kesimpulan bahwa program harus dihentikan."],"correct":[2],"stimulus":"Perhatikan susunan laporan: paragraf pertama memperkenalkan program serta manfaat yang diharapkan; paragraf kedua memaparkan kendala berdasarkan catatan pengelola; paragraf ketiga menjelaskan usulan perbaikan dan batas klaim peneliti. Anda harus mengidentifikasi kontribusi paragraf kedua terhadap keseluruhan struktur argumentasi laporan.","illustration":{"kind":"flow","title":"Struktur laporan","items":["Konteks dan manfaat","Kendala berbasis data","Usulan perbaikan"],"caption":"Setiap bagian mempunyai fungsi yang berbeda dalam membangun laporan."}},{"type":"single","prompt":"Dalam cerpen tentang seorang anak yang terus menyimpan tiket kereta milik ayahnya, tiket itu paling mungkin berfungsi sebagai simbol …","options":["Keinginan tokoh untuk menjadi masinis.","Kenangan dan ikatan emosional yang belum selesai.","Bukti bahwa perjalanan kereta selalu menyenangkan.","Penolakan tokoh terhadap semua bentuk perubahan teknologi.","Petunjuk pasti bahwa ayah tokoh masih berada di stasiun."],"correct":[1],"stimulus":"Dalam cerpen, tokoh utama tinggal bersama neneknya setelah ayahnya bekerja jauh. Ia menyimpan tiket kereta lama dalam kotak kecil dan selalu membukanya ketika keluarga membicarakan kepulangan ayah. Pengarang tidak pernah menjelaskan secara langsung perasaan tokoh, tetapi tindakan mengulang, benda yang dipilih, dan konteks percakapan memberi pembaca petunjuk untuk menafsirkan simbol.","illustration":null},{"type":"multi","prompt":"Pilih SEMUA ciri argumen yang menunjukkan penalaran kuat dalam teks editorial.","options":["Klaim utama disertai data yang relevan dan sumber yang dapat diperiksa.","Pendapat lawan digambarkan secara berlebihan agar mudah diserang.","Penulis mengakui keterbatasan data dan menjelaskan batas simpulannya.","Kesimpulan ditarik dari satu pengalaman pribadi untuk mewakili seluruh masyarakat.","Hubungan antara bukti dan klaim dijelaskan secara masuk akal."],"correct":[0,2,4],"stimulus":"Redaksi sekolah sedang menilai editorial tentang penggunaan gawai di kelas. Editorial yang baik tidak cukup memiliki pendirian tegas; argumennya perlu ditopang bukti, menunjukkan hubungan logis antara data dan klaim, serta tidak menyembunyikan keterbatasan penelitian. Pilih semua ciri yang memenuhi prinsip tersebut.","illustration":null},{"type":"single","prompt":"Judul yang paling seimbang untuk laporan berdasarkan stimulus kebun kota adalah …","options":["Kebun Kota Menyelesaikan Krisis Pangan Selamanya","Warga Terbukti Tidak Mampu Mengelola Lahan","Kebun Komunitas Menawarkan Manfaat, Pengelola Masih Hadapi Kendala","Program Kebun Kota Harus Dihapus Sekarang Juga","Panen Sayuran Tidak Lagi Memiliki Arti"],"correct":[2],"stimulus":"Anda menjadi editor laporan feature sekolah. Judul perlu menarik perhatian, mencerminkan temuan yang benar-benar didukung naskah, dan tidak menambah klaim mutlak yang tidak ditemukan dalam data. Program yang dibahas memiliki manfaat, tetapi pengelolaan masih menghadapi masalah teknis dan koordinasi.","illustration":null},{"type":"single","prompt":"Berdasarkan data produktivitas petak A dan B pada ilustrasi, pernyataan yang paling tepat adalah …","options":["Petak A paling produktif karena luasnya lebih besar.","Petak B memiliki produktivitas per meter persegi lebih tinggi meskipun luasnya lebih kecil.","Kedua petak menghasilkan total panen yang sama.","Petak B pasti menghasilkan panen total lebih banyak daripada petak A.","Luas lahan tidak pernah memengaruhi hasil panen."],"correct":[1],"stimulus":"Data produktivitas perlu dibaca dengan membedakan luas total dan hasil per satuan luas. Produktivitas adalah ukuran hasil dibandingkan sumber daya yang digunakan, sedangkan total produksi bergantung pada produktivitas sekaligus luas lahan. Hindari menyimpulkan sesuatu yang tidak ditunjukkan oleh angka.","illustration":{"kind":"table","title":"Perbandingan produktivitas","headers":["Petak","Luas","Hasil per m²"],"rows":[["A","120 m²","2,4 kg"],["B","80 m²","3,1 kg"]],"caption":"Bandingkan ukuran produktivitas, bukan hanya besar lahan."}},{"type":"single","prompt":"Kalimat kutipan langsung yang paling tepat dari sisi tanda baca adalah …","options":["Koordinator berkata “Data harus diperiksa kembali”.","Koordinator berkata, “Data harus diperiksa kembali.”","Koordinator berkata, “Data harus diperiksa kembali”.","Koordinator berkata: “Data harus diperiksa kembali”.","Koordinator berkata “Data harus diperiksa kembali,”."],"correct":[1],"stimulus":"Dalam penyuntingan berita, kutipan langsung harus mengikuti kaidah tanda baca bahasa Indonesia. Kalimat pengiring berupa pernyataan diletakkan sebelum kutipan dengan tanda koma, sedangkan tanda titik penutup kalimat ditempatkan di dalam tanda petik pada contoh kalimat deklaratif.","illustration":null},{"type":"single","prompt":"Narator menyebut bahwa tokoh “tersenyum sambil merapikan surat yang tak jadi dikirim”. Inferensi paling beralasan dari tindakan itu adalah …","options":["Tokoh pasti tidak memahami isi surat.","Tokoh mungkin menyembunyikan kekecewaan atau memilih menahan pesan yang ingin disampaikan.","Tokoh tidak pernah ingin berbicara dengan siapa pun.","Tokoh telah berhasil menyelesaikan semua persoalannya.","Tokoh sedang menyiapkan surat lamaran kerja."],"correct":[1],"stimulus":"Pengarang kerap menunjukkan konflik batin melalui gestur, benda, dan tindakan kecil alih-alih menjelaskan perasaan secara langsung. Dalam sebuah cerita, tokoh menulis surat untuk sahabatnya setelah perselisihan, tetapi kemudian melipatnya kembali, tersenyum tipis, dan menyimpannya. Pembaca perlu membuat inferensi yang masuk akal tanpa menganggap satu tafsir sebagai kepastian mutlak.","illustration":null},{"type":"multi","prompt":"Pilih SEMUA perbaikan yang tepat untuk kalimat “Berdasarkan daripada hasil wawancara menunjukkan bahwa warga membutuhkan pelatihan.”","options":["Menghapus “daripada” sehingga menjadi “Berdasarkan hasil wawancara, warga membutuhkan pelatihan.”","Mengubahnya menjadi “Hasil wawancara menunjukkan bahwa warga membutuhkan pelatihan.”","Menulis “Berdasarkan daripada wawancara, menunjukkan warga membutuhkan pelatihan.”","Mengubahnya menjadi “Warga membutuhkan pelatihan berdasarkan hasil wawancara.”","Mengganti “warga” menjadi “daripada warga” agar kalimat lebih formal."],"correct":[0,1,3],"stimulus":"Kalimat tersebut mengandung bentuk pemborosan dan subjek yang tidak jelas. Penyunting dapat memperbaiki struktur dengan memilih pola “berdasarkan hasil…” atau menjadikan “hasil wawancara” sebagai subjek dari verba “menunjukkan”. Pilih semua hasil suntingan yang gramatikal dan tetap mempertahankan makna.","illustration":null},{"type":"single","prompt":"Seseorang menyatakan, “Dua alumni yang gagal diterima universitas berarti seluruh program bimbingan sekolah tidak berguna.” Kelemahan penalaran utama pernyataan itu adalah …","options":["Analogi yang membandingkan dua objek identik.","Generalisasi berlebihan dari sampel kecil tanpa mempertimbangkan faktor lain.","Kesimpulan matematis yang berasal dari rumus salah.","Penggunaan istilah ilmiah yang terlalu teknis.","Penggunaan data longitudinal selama puluhan tahun."],"correct":[1],"stimulus":"Pada rapat evaluasi, seorang peserta menggunakan dua contoh kegagalan untuk menolak program bimbingan yang diikuti ratusan siswa. Ia tidak membandingkan tingkat penerimaan sebelum dan sesudah program, tidak menelusuri variasi persiapan siswa, serta tidak menunjukkan data kelompok lain. Anda diminta mengidentifikasi cacat logika paling menonjol.","illustration":null},{"type":"single","prompt":"Ringkasan yang paling tepat untuk teks kebun kota adalah …","options":["Kebun kota sepenuhnya gagal karena sebagian warga masih membeli sayuran dan tidak perlu diperbaiki.","Kebun kota memberi potensi manfaat bagi warga, tetapi kendala air, jadwal, dan keterampilan menuntut pendampingan agar pengelolaan lebih efektif.","Kelurahan membuat kebun hanya supaya memperoleh pujian dari media.","Peneliti melarang semua bentuk kebun komunitas karena distribusi pangan lebih penting.","Warga tidak memiliki minat pada kegiatan pertanian perkotaan."],"correct":[1],"stimulus":"Ringkasan yang baik merangkum gagasan pokok secara proporsional, memasukkan manfaat dan kendala yang penting, serta tidak menyisipkan opini baru. Ringkasan tidak seharusnya menyalin seluruh rincian atau mengubah nuansa teks menjadi klaim ekstrem.","illustration":null},{"type":"multi","prompt":"Pilih SEMUA simpulan yang sejalan dengan data berikut.","options":["Persentase responden yang memeriksa sumber meningkat setelah lokakarya.","Data membuktikan bahwa semua siswa kini tidak pernah menyebarkan informasi salah.","Perubahan kebiasaan dapat diukur melalui perbandingan sebelum dan sesudah kegiatan.","Lokakarya pasti menjadi satu-satunya penyebab perubahan tanpa faktor lain.","Kenaikan indikator belum menjamin seluruh perilaku digital sudah ideal."],"correct":[0,2,4],"stimulus":"Sebuah sekolah menyelenggarakan lokakarya literasi digital. Survei anonim dilakukan terhadap kelompok siswa yang sama sebelum kegiatan dan satu bulan setelahnya. Hasil menunjukkan kenaikan pada beberapa indikator, tetapi survei tidak memeriksa setiap unggahan siswa dan tidak mempunyai kelompok pembanding yang tidak mengikuti kegiatan.","illustration":{"kind":"bars","title":"Siswa yang memeriksa sumber sebelum membagikan informasi","items":[{"label":"Sebelum lokakarya","value":42,"display":"42%"},{"label":"Satu bulan sesudah","value":68,"display":"68%"}],"caption":"Hasil survei menunjukkan perubahan indikator, bukan bukti sebab-akibat yang mutlak."}},{"type":"single","prompt":"Dalam bagian penutup teks argumentasi, fungsi penegasan ulang yang tepat adalah …","options":["Memperkenalkan tokoh baru tanpa kaitan dengan topik.","Mengulang seluruh paragraf dengan kata-kata yang sama.","Menegaskan kembali posisi penulis berdasarkan alasan yang telah dibahas tanpa menambah klaim baru yang tidak didukung.","Menggantikan bukti dengan seruan emosional.","Menyisipkan data yang bertentangan dengan bagian argumentasi."],"correct":[2],"stimulus":"Siswa kelas XII menyusun esai tentang kebijakan pembatasan plastik sekali pakai. Di bagian awal ia menyatakan tesis, lalu menyajikan data sampah, biaya alternatif, dan tantangan penerapan. Di bagian penutup, ia perlu merangkum makna argumen sekaligus menyatakan rekomendasi yang sejalan dengan bukti.","illustration":null},{"type":"single","prompt":"Sebuah cerpen berakhir ketika tokoh mengembalikan kunci rumah kepada ibunya, lalu berjalan pergi tanpa menoleh. Tafsir yang paling bernalar adalah …","options":["Peristiwa itu pasti menunjukkan tokoh akan pindah ke luar negeri.","Tindakan mengembalikan kunci dapat menandai keputusan melepaskan peran atau hubungan lama, bergantung pada konflik sebelumnya.","Tokoh ingin segera membeli rumah baru.","Akhir cerita tidak dapat ditafsirkan karena tidak menjelaskan masa depan tokoh.","Ibu tokoh dipastikan telah meninggal."],"correct":[1],"stimulus":"Dalam cerita sebelumnya, kunci rumah menjadi tanda kepercayaan yang diberikan keluarga kepada tokoh. Setelah konflik panjang mengenai pilihan hidup, tokoh mengembalikan kunci tersebut. Cerita ditutup tanpa penjelasan langsung mengenai masa depan. Pembaca diminta menafsirkan fungsi simbol berdasarkan perkembangan konflik, bukan membuat prediksi yang tidak didukung.","illustration":null}],"Bahasa Inggris":[{"type":"single","prompt":"Which conclusion is best supported by the passage?","options":["The mentoring programme eliminated every barrier to university admission.","Students should stop using online learning resources.","Mentoring may improve access when combined with reliable information and practical support.","Universities should admit applicants without reviewing their applications.","Only students with high grades can benefit from mentoring."],"correct":[2],"stimulus":"At a public senior high school, counsellors noticed that many final-year students postponed university applications. Interviews showed that some were unsure how to compare financial-aid offers, while others misunderstood document deadlines. The school introduced weekly mentoring sessions and a shared calendar. More students submitted complete applications the following term, although several still needed help arranging transport for entrance examinations. The counsellor therefore described mentoring as a useful support system, not a guarantee of admission.","illustration":{"kind":"quote","title":"Counsellor’s progress note","lines":["More complete applications were submitted.","Deadline confusion declined.","Travel costs remained a barrier for some students."],"caption":"The report identifies progress as well as unresolved obstacles."}},{"type":"multi","prompt":"Select ALL inferences that are justified by the passage.","options":["Clearer deadline information may help students complete applications.","Every student who attended mentoring was admitted to a university.","Financial and transport barriers may require different kinds of support.","The school proved that academic grades are irrelevant to admission.","The counsellor views mentoring as helpful but not sufficient on its own."],"correct":[0,2,4],"stimulus":"Read the school-counselling report carefully. It describes an improvement in application completion, yet it also names practical barriers that remain. A sound inference must follow from the evidence rather than exaggerate a positive trend into a universal claim.","illustration":{"kind":"flow","title":"Barriers identified","items":["Deadline confusion","Financial-aid uncertainty","Transport costs"],"caption":"Different barriers require different responses."}},{"type":"single","prompt":"A student writes, “The programme was effective because many students said they liked it.” Which revision would make the claim academically stronger?","options":["The programme was obviously perfect because students enjoyed it.","The programme was effective, since no other explanation is possible.","The programme may have been well received; effectiveness should also be assessed using application-completion data and relevant comparisons.","The programme worked for everyone because the students were honest.","The programme was popular, which proves that all its methods caused improvement."],"correct":[2],"stimulus":"In an academic report, favourable opinions can indicate acceptance, but satisfaction alone does not establish an intervention’s effect. The writer wants to make a careful claim that distinguishes participants’ attitudes from measurable outcomes and recognises the limits of the available evidence.","illustration":null},{"type":"single","prompt":"What is the main purpose of the final sentence in the passage?","options":["To dismiss the positive results reported earlier.","To qualify the claim and prevent readers from treating mentoring as a guarantee.","To introduce an unrelated topic about school transport.","To accuse students of failing to prepare.","To suggest that deadlines should no longer be used."],"correct":[1],"stimulus":"The passage moves from a problem, to an intervention, to an observed improvement. It ends by reminding readers that some students still face barriers and that mentoring is a support system rather than a guarantee. The final sentence therefore narrows the strength of the conclusion.","illustration":null},{"type":"single","prompt":"In the phrase “students postponed applications,” the word “postponed” is closest in meaning to …","options":["cancelled permanently","delayed until a later time","completed ahead of schedule","submitted secretly","copied from another person"],"correct":[1],"stimulus":"During an interview, several students explained that they wanted to apply but delayed taking action because the requirements seemed confusing. They had not abandoned their plans; rather, they waited until they understood the process or received assistance. Choose the closest meaning in this context.","illustration":null},{"type":"multi","prompt":"Select ALL features that would make the school’s evaluation more reliable.","options":["Compare application completion before and after the intervention using the same definitions.","Report only positive student comments and exclude all concerns.","Explain the number of students involved and any missing data.","Claim that the programme caused the change without considering other changes at school.","Where feasible, compare with a similar group that did not receive the intervention."],"correct":[0,2,4],"stimulus":"The school wants to determine whether mentoring contributed to improved application completion. A transparent evaluation should explain how indicators were measured, disclose limitations, and consider an appropriate comparison. Select all practices that strengthen the credibility of the findings.","illustration":null},{"type":"single","prompt":"Choose the sentence that is grammatically correct and maintains a formal academic tone.","options":["Although the deadline was extended, several applicants had already submitted their documents.","Despite the deadline was extended, several applicants had already submit their documents.","Although the deadline extending, several applicants already submits documents.","In spite the deadline was extended, several applicants has submitted documents.","Even the deadline was extended, several applicants had submit documents."],"correct":[0],"stimulus":"A final-year student is editing an English report about application deadlines. The sentence must express contrast between an extension and the fact that some applications had been submitted earlier. It should also use correct clause structure and tense.","illustration":null},{"type":"single","prompt":"Which statement best describes the relationship between the two events: “The team checked the financial-aid criteria. It then recommended three suitable scholarships”?","options":["The second event is a result of the first event.","The events are contradictory.","The first event happened because of the second.","The second event is an unrelated example.","The first event expresses a hypothetical condition."],"correct":[0],"stimulus":"A report explains the team’s workflow. Before making recommendations, the counsellors reviewed eligibility rules, family-income requirements, and application dates. Only after this review did they shortlist three options for each student. The question asks for the logical relation between the actions.","illustration":{"kind":"timeline","title":"Counselling workflow","items":["Review eligibility","Compare deadlines","Recommend suitable options"],"caption":"The recommendation follows the eligibility review."}},{"type":"single","prompt":"In a formal email asking a university to clarify an unclear document requirement, which opening is most appropriate?","options":["Hey, your website makes no sense at all.","I need you to fix this immediately.","Dear Admissions Team, I am writing to request clarification regarding the required supporting documents.","What’s up? I have a problem with your rules.","Listen, I don’t understand anything you posted."],"correct":[2],"stimulus":"You are a Grade XII student preparing an application. The official website appears to list two different document formats, and you want to ask for clarification without sounding accusatory. The message should be concise, respectful, and specific about its purpose.","illustration":null},{"type":"single","prompt":"A report states, “Had the school provided travel assistance, more eligible students might have attended the entrance examination.” What does this sentence imply?","options":["Travel assistance was provided to every student.","The examination was cancelled.","Travel assistance was not fully available, and its absence may have affected attendance.","All eligible students attended the examination.","The school is certain that every absent student failed."],"correct":[2],"stimulus":"Several eligible applicants missed an entrance examination because they could not afford transport. The report uses a third conditional structure to discuss an unreal past situation and its possible consequence. Interpret the implied relationship without treating a possibility as absolute certainty.","illustration":null},{"type":"multi","prompt":"Select ALL sentences that use appropriate hedging for a research report.","options":["The findings suggest that clearer reminders may improve submission rates.","This single survey proves beyond doubt that the policy works for everyone.","The observed increase could partly reflect changes in student awareness.","It is impossible for any other factor to have influenced the results.","Further study is needed before the effect can be generalised to other schools."],"correct":[0,2,4],"stimulus":"Academic writers often use cautious language when evidence is limited. Hedging signals the strength of a claim and acknowledges alternative explanations. Select all sentences that present findings carefully rather than overstating certainty.","illustration":null},{"type":"single","prompt":"Read the data display. Which interpretation is most defensible?","options":["The workshop proves that every participant now verifies all information.","The share of surveyed students who checked sources increased, but the data alone cannot prove the workshop was the only cause.","The number of students who checked sources decreased by 26 percentage points.","The survey shows that students no longer use social media.","The survey is invalid because its results changed over time."],"correct":[1],"stimulus":"A school repeats the same anonymous questionnaire one month after a media-literacy workshop. More respondents report checking the origin of a post before sharing it. The school did not use a comparison group and did not observe every student’s online activity, so the results are useful but limited.","illustration":{"kind":"bars","title":"Respondents who check the source before sharing","items":[{"label":"Before the workshop","value":39,"display":"39%"},{"label":"One month later","value":65,"display":"65%"}],"caption":"The indicator rose by 26 percentage points; causal attribution remains limited."}},{"type":"single","prompt":"Which sentence uses the correct inversion for a formal conditional?","options":["Were the school to extend mentoring, more students could receive support.","Was the school to extended mentoring, more students could receive support.","Were the school extends mentoring, more students can received support.","If were the school extend mentoring, students could receive support.","Were the school extending yesterday, more students receive support."],"correct":[0],"stimulus":"The writer is describing a possible policy option in a formal proposal and wants to avoid the ordinary “if” clause. The sentence should use conditional inversion correctly, followed by a modal phrase that expresses a possible consequence.","illustration":null},{"type":"single","prompt":"In the sentence “The guidance, which was introduced in August, reduced confusion about deadlines,” what does the relative clause do?","options":["It identifies the only guidance ever created.","It adds non-essential information about when the guidance was introduced.","It gives a condition for the guidance to work.","It expresses the consequence of a hypothetical event.","It changes “guidance” into a plural noun."],"correct":[1],"stimulus":"A writer is editing a research summary. The noun “guidance” is already identified, and the clause between commas simply adds background information. Understanding the function of the relative clause helps preserve the intended meaning and punctuation.","illustration":null},{"type":"multi","prompt":"Select ALL paraphrases that preserve the meaning of: “The results are promising, although the sample is too small to support a broad generalisation.”","options":["The findings appear encouraging, but the limited sample restricts how widely they can be applied.","Because the results are promising, they can be generalised to every school.","The findings may be useful, yet a larger sample is needed before drawing broad conclusions.","The sample is so large that no further research is required.","The results are negative and have no possible value."],"correct":[0,2],"stimulus":"A student is paraphrasing a cautious conclusion for an English research abstract. A good paraphrase changes wording but maintains both key ideas: the results are encouraging, and a small sample limits generalisation. It must not turn caution into certainty or reverse the evaluation.","illustration":null},{"type":"single","prompt":"A reviewer writes, “Only careless students missed the deadline.” What is the most important weakness in this statement?","options":["It gives a precise statistical estimate.","It assumes a single personal cause and ignores possible structural barriers.","It distinguishes evidence from opinion carefully.","It provides a balanced account of every case.","It uses a properly controlled experiment."],"correct":[1],"stimulus":"A review of university applications finds that some students missed deadlines. Interviews mention confusing instructions, shared family devices, and unstable internet access. A reviewer nevertheless labels every student who missed the deadline as careless. The question asks you to evaluate the reasoning behind that judgement.","illustration":null},{"type":"single","prompt":"Choose the best summary of the counselling report.","options":["Mentoring guarantees admission, so other forms of support are unnecessary.","A school mentoring programme coincided with more complete applications, but practical barriers remain and the evidence does not establish a universal causal effect.","Students refused to apply because universities require too many documents.","The counsellor concluded that financial aid should be removed from applications.","The programme failed because not every student was admitted."],"correct":[1],"stimulus":"An effective summary includes the central intervention, the observed outcome, and the key limitation. It excludes minor details and avoids making claims that the report does not support. Consider both the improvement in application completion and the continuing barriers described by the counsellor.","illustration":null},{"type":"multi","prompt":"Select ALL claims that can be supported by the data display and accompanying description.","options":["Reported source-checking increased from 39% to 65% in the survey.","The percentage increased by 26 percentage points.","The survey alone proves the workshop caused every individual to change behaviour.","The same questionnaire was administered again one month later.","No respondent could possibly have answered inaccurately because the survey was anonymous."],"correct":[0,1,3],"stimulus":"The illustration reports the proportion of respondents who say they check sources. The description states that the same anonymous questionnaire was repeated after a month. The data record self-reported behaviour, not direct observation, so interpretations should stay within those boundaries.","illustration":{"kind":"bars","title":"Reported source-checking behaviour","items":[{"label":"Initial survey","value":39,"display":"39%"},{"label":"Follow-up","value":65,"display":"65%"}],"caption":"An increase of 26 percentage points is supported; individual causal conclusions are not."}},{"type":"single","prompt":"Which concluding sentence best fits a balanced argumentative essay about mentoring?","options":["For this reason, mentoring must replace every other support service.","Therefore, no further evaluation is necessary.","Mentoring should be maintained and evaluated alongside targeted assistance for financial, document, and transport barriers.","Consequently, students who miss a deadline should be denied all future support.","This proves that all schools must use exactly the same programme."],"correct":[2],"stimulus":"Your essay argues that mentoring helps students navigate complicated applications, but also notes that some problems require additional resources. The final sentence should follow from both sides of the argument, make a practical recommendation, and avoid an unsupported universal claim.","illustration":null},{"type":"single","prompt":"In a narrative, a character repeatedly checks an unopened letter but finally places it in a drawer. Which interpretation is most reasonable?","options":["The character certainly cannot read.","The letter may represent a difficult truth or conversation the character is not yet ready to face.","The character definitely plans to destroy the house.","The letter proves that a stranger has committed a crime.","The character has forgotten that letters exist."],"correct":[1],"stimulus":"A short story follows a young adult who receives a letter from an estranged sibling. The narrator describes the character touching the envelope every evening, beginning to open it, and then putting it away. The story never reveals the letter’s contents. Readers must interpret the repeated action while respecting what remains unknown.","illustration":null}],"Matematika":[{"type":"single","prompt":"Sebuah perusahaan rintisan mencatat biaya produksi dan pendapatan harian melalui fungsi sederhana. Manajer ingin mengetahui laju perubahan pendapatan sesaat saat jumlah produk yang terjual mendekati 20 unit. Jika R(x)=−2x²+120x−1.000 menyatakan pendapatan bersih dalam ribuan rupiah, berapakah R′(20)?","options":["20","40","60","80","120"],"correct":[1],"stimulus":"Tim bisnis tidak cukup hanya mengetahui pendapatan total; mereka juga memerlukan laju perubahan untuk menentukan apakah penambahan produksi masih memberi manfaat marginal. Model R(x)=−2x²+120x−1.000 digunakan sebagai pendekatan lokal, dengan x menyatakan jumlah unit dan R dalam ribuan rupiah.","illustration":{"kind":"formula","title":"Model pendapatan","items":["R(x) = −2x² + 120x − 1.000","R′(x) = −4x + 120","Evaluasi pada x = 20"],"caption":"Turunan pertama menyatakan laju perubahan sesaat."}},{"type":"multi","prompt":"Pilih SEMUA pernyataan yang benar tentang fungsi f(x)=x³−6x²+9x+2 pada interval bilangan real.","options":["Turunan pertama adalah f′(x)=3x²−12x+9.","Titik stasioner terjadi pada x=1 dan x=3.","Fungsi selalu naik untuk setiap x real.","Fungsi naik pada interval x<1 dan x>3.","Fungsi turun pada interval 1<x<3."],"correct":[0,1,3,4],"stimulus":"Seorang siswa meneliti bentuk grafik fungsi kubik untuk menentukan interval kenaikan dan penurunan tanpa menggambar setiap titik. Ia menghitung turunan pertama, mencari akar turunan, lalu menguji tanda turunan pada interval yang terbentuk. Gunakan prosedur tersebut untuk memeriksa semua pernyataan.","illustration":{"kind":"formula","title":"Langkah analisis turunan","items":["Hitung f′(x)","Cari f′(x)=0","Uji tanda pada setiap interval"],"caption":"Tanda turunan menentukan apakah fungsi naik atau turun."}},{"type":"single","prompt":"Sebuah sensor suhu menghasilkan data yang mendekati fungsi g(x)=(x²−9)/(x−3). Untuk menentukan nilai limit saat x mendekati 3, siswa diminta menghindari substitusi langsung yang menghasilkan bentuk 0/0. Nilai limit yang tepat adalah …","options":["0","3","6","9","Tidak ada karena penyebut nol"],"correct":[2],"stimulus":"Dalam pengujian alat, satu titik data tidak dapat dibaca tepat saat x=3, tetapi pembacaan di sekitar titik tersebut menunjukkan pola yang stabil. Model matematisnya adalah g(x)=(x²−9)/(x−3) untuk x≠3. Analisis limit digunakan untuk memperkirakan nilai yang didekati fungsi, bukan nilai fungsi di titik itu sendiri.","illustration":{"kind":"formula","title":"Penyederhanaan sebelum limit","items":["x² − 9 = (x − 3)(x + 3)","g(x) = x + 3, untuk x ≠ 3","x mendekati 3"],"caption":"Faktorkan lebih dahulu, lalu evaluasi bentuk sederhananya."}},{"type":"multi","prompt":"Sebuah toko mengukur waktu layanan (menit) untuk tujuh pelanggan: 4, 5, 5, 6, 7, 8, 21. Manajer menyatakan bahwa rata-rata adalah ukuran terbaik untuk mewakili waktu layanan tipikal. Pilih SEMUA evaluasi yang tepat.","options":["Rata-rata data adalah 8 menit.","Median data adalah 6 menit.","Nilai 21 menit menaikkan rata-rata dibandingkan sebagian besar pengamatan.","Median pasti berubah menjadi 8 menit jika angka 21 dihapus.","Nilai ekstrem membuat median selalu tidak bisa digunakan."],"correct":[0,1,2],"stimulus":"Manajer perlu memilih ukuran pemusatan untuk laporan kepada pelanggan. Enam waktu pertama berkumpul di rentang 4–8 menit, sedangkan satu pelanggan memerlukan waktu jauh lebih lama karena dokumen tidak lengkap. Ukuran pemusatan perlu ditafsirkan dengan memperhatikan pencilan, bukan sekadar menghitung satu angka.","illustration":{"kind":"table","title":"Waktu layanan yang diamati","headers":["Urutan data","1","2","3","4","5","6","7"],"rows":[["Menit","4","5","5","6","7","8","21"]],"caption":"Satu pengamatan jauh di atas kelompok data lainnya."}},{"type":"single","prompt":"Dalam sebuah kotak terdapat 4 kartu merah dan 3 kartu biru. Dua kartu diambil satu per satu tanpa pengembalian. Jika kartu pertama yang terambil berwarna merah, peluang kartu kedua berwarna biru adalah …","options":["1/7","1/2","3/7","4/6","4/7"],"correct":[1],"stimulus":"Dalam simulasi pengambilan kartu untuk pelajaran peluang, kartu yang terambil tidak dikembalikan sebelum pengambilan kedua. Seorang siswa keliru tetap menggunakan komposisi awal 4 merah dan 3 biru pada pengambilan kedua. Tentukan peluang bersyarat dengan memperbarui jumlah kartu setelah informasi pengambilan pertama diketahui.","illustration":{"kind":"formula","title":"Setelah kartu merah pertama diambil","items":["Sisa kartu merah: 3","Sisa kartu biru: 3","Total kartu tersisa: 6"],"caption":"Peluang biru pada pengambilan kedua dihitung dari komposisi yang tersisa."}},{"type":"single","prompt":"Sebuah laboratorium membentuk model pertumbuhan bakteri P(t)=500·2^(t/3), dengan t dalam jam. Jika model berlaku, kapan populasi diperkirakan mencapai 4.000 bakteri?","options":["3 jam","6 jam","9 jam","12 jam","24 jam"],"correct":[2],"stimulus":"Pada awal pengamatan terdapat 500 bakteri. Catatan laboratorium menunjukkan populasi berlipat ganda setiap tiga jam selama kondisi nutrisi tetap. Model eksponensial digunakan untuk memperkirakan kapan populasi mencapai ambang yang memerlukan tindakan, meskipun pada praktiknya pertumbuhan dapat berubah jika sumber daya terbatas.","illustration":{"kind":"timeline","title":"Pola pelipatan populasi","items":["t=0: 500","t=3: 1.000","t=6: 2.000","t=9: 4.000"],"caption":"Setiap tiga jam, populasi model menjadi dua kali lipat."}},{"type":"single","prompt":"Seorang analis memodelkan biaya pemeliharaan mesin sebagai C(x)=x²−8x+30, dengan x menyatakan banyaknya jam operasi harian dalam satuan yang disederhanakan. Untuk nilai x real, nilai minimum fungsi dan lokasi minimumnya adalah …","options":["Nilai minimum 14 pada x=4","Nilai minimum 30 pada x=0","Nilai minimum 8 pada x=4","Nilai minimum 2 pada x=8","Tidak memiliki minimum karena fungsi kuadrat"],"correct":[0],"stimulus":"Tim teknis menggunakan model kuadrat untuk membandingkan strategi operasi. Karena koefisien x² positif, grafik parabola membuka ke atas dan memiliki titik puncak minimum. Titik minimum dapat dicari dengan melengkapkan kuadrat atau menggunakan x=−b/(2a), kemudian menghitung nilai fungsi pada titik tersebut.","illustration":{"kind":"formula","title":"Melengkapkan kuadrat","items":["C(x) = x² − 8x + 30","C(x) = (x − 4)² + 14","Nilai minimum terjadi saat kuadrat bernilai 0"],"caption":"Bentuk kuadrat sempurna memperlihatkan titik minimum."}},{"type":"single","prompt":"Peluang sebuah komponen lolos uji kualitas adalah 0,9 dan setiap komponen dianggap independen. Untuk satu paket berisi 3 komponen, berapakah peluang tepat dua komponen lolos uji?","options":["0,027","0,081","0,243","0,729","0,972"],"correct":[2],"stimulus":"Sistem kendali mutu menguji tiga komponen secara independen. Paket hanya memperoleh status “tepat dua lolos” jika dua komponen memenuhi standar dan satu tidak. Banyak susunan yang mungkin perlu dihitung; jangan menyamakan peristiwa tepat dua lolos dengan peristiwa semua lolos.","illustration":{"kind":"formula","title":"Distribusi binomial","items":["n = 3","p = 0,9","P(X=2) = C(3,2) × (0,9)² × (0,1)"],"caption":"Pilih dua posisi yang lolos, lalu kalikan probabilitas tiap susunan."}},{"type":"single","prompt":"Sebuah ramp akses dirancang sepanjang 5 m dengan kenaikan vertikal 1,2 m. Jika sudut ramp terhadap permukaan horizontal adalah θ, nilai sin θ yang tepat berdasarkan model segitiga siku-siku adalah …","options":["1,2/5","5/1,2","√(25−1,44)/5","1,2/√(25−1,44)","5/√(25−1,44)"],"correct":[0],"stimulus":"Arsitek menghitung kemiringan ramp sebagai segitiga siku-siku: panjang ramp menjadi sisi miring, dan kenaikan vertikal menjadi sisi di depan sudut terhadap bidang horizontal. Penentuan rasio trigonometri harus didasarkan pada posisi sisi terhadap sudut, bukan sekadar memilih dua angka yang tersedia.","illustration":{"kind":"ramp","title":"Ilustrasi ukuran ramp","items":["Sisi miring = 5 m","Tinggi = 1,2 m","sin θ = sisi depan / sisi miring"],"caption":"Tentukan sisi berdasarkan sudut θ terhadap horizontal."}},{"type":"multi","prompt":"Pilih SEMUA pernyataan yang benar mengenai fungsi h(x)=ln(x−2).","options":["Domain fungsi adalah x>2.","Grafik memiliki asimtot vertikal x=2.","h(3)=0.","Fungsi terdefinisi untuk seluruh bilangan real.","Fungsi naik pada domainnya."],"correct":[0,1,2,4],"stimulus":"Sebuah model respons logaritmik hanya valid ketika masukan memenuhi syarat pada argumen logaritma. Untuk h(x)=ln(x−2), nilai di dalam logaritma harus positif. Sifat monoton fungsi logaritma natural juga membantu menganalisis bentuk grafiknya pada domain yang sah.","illustration":{"kind":"formula","title":"Syarat dan sifat logaritma","items":["x − 2 > 0","ln(1) = 0","ln(x) meningkat untuk x > 0"],"caption":"Periksa domain terlebih dahulu sebelum menentukan nilai dan sifat grafik."}},{"type":"single","prompt":"Sebuah perusahaan memproyeksikan nilai dana dengan bunga majemuk tahunan. Modal awal Rp10.000.000 tumbuh dengan bunga 6% per tahun, dibukukan sekali setiap akhir tahun. Nilai dana setelah dua tahun, sebelum biaya lain, adalah …","options":["Rp10.600.000","Rp11.000.000","Rp11.236.000","Rp11.200.000","Rp12.000.000"],"correct":[2],"stimulus":"Dana awal tidak hanya memperoleh bunga dari modal pokok pada tahun pertama; pada tahun kedua, bunga juga dihitung atas bunga yang sudah masuk ke saldo. Model bunga majemuk tahunan adalah A=P(1+r)^t, dengan P modal awal, r tingkat bunga tahunan, dan t jumlah tahun.","illustration":{"kind":"timeline","title":"Perkembangan saldo","items":["Awal: Rp10.000.000","Akhir tahun 1: × 1,06","Akhir tahun 2: × 1,06 lagi"],"caption":"Setiap tahun, saldo dikalikan faktor pertumbuhan 1,06."}},{"type":"single","prompt":"Sebuah perusahaan memproduksi dua paket P dan Q. Paket P memerlukan 2 jam mesin A dan 1 jam mesin B; paket Q memerlukan 1 jam mesin A dan 2 jam mesin B. Tersedia paling banyak 100 jam mesin A dan 80 jam mesin B. Jika x dan y masing-masing jumlah paket P dan Q, kendala sumber daya yang benar adalah …","options":["2x+y≤100 dan x+2y≤80","2x+y≥100 dan x+2y≥80","x+y≤100 dan x+y≤80","2x+2y≤100 dan x+y≤80","x+2y≤100 dan 2x+y≤80"],"correct":[0],"stimulus":"Kepala produksi ingin merencanakan campuran dua paket tanpa melewati kapasitas. Setiap paket P memakai lebih banyak waktu mesin A, sementara paket Q lebih banyak memakai mesin B. Model linear harus menghubungkan jumlah produk dengan waktu penggunaan setiap mesin dan batas jam yang tersedia.","illustration":{"kind":"table","title":"Waktu mesin per paket","headers":["Paket","Mesin A","Mesin B"],"rows":[["P","2 jam","1 jam"],["Q","1 jam","2 jam"],["Kapasitas","100 jam","80 jam"]],"caption":"Total pemakaian setiap mesin tidak boleh melebihi kapasitasnya."}},{"type":"single","prompt":"Sebuah kurva permintaan dimodelkan oleh f(x)=x²−4x+1. Kemiringan garis singgung pada kurva di x=3 adalah …","options":["0","1","2","3","4"],"correct":[2],"stimulus":"Analis ingin mengetahui perubahan sesaat kurva pada titik tertentu untuk membandingkan dua skenario permintaan. Gradien garis singgung diperoleh dari turunan pertama, lalu dievaluasi pada x yang diberikan. Jangan menghitung gradien garis secant menggunakan dua titik sembarang.","illustration":null},{"type":"multi","prompt":"Pilih SEMUA pernyataan yang benar untuk integral tentu ∫₀² (3x²−4x+2) dx.","options":["Antiturunannya dapat ditulis x³−2x²+2x + C.","Nilai integral tentu tersebut adalah 4.","Nilai integral tentu menyatakan luas bertanda di antara grafik dan sumbu-x.","Nilai integral tentu pasti negatif karena suku −4x muncul pada integran.","Konstanta C harus dikurangkan secara terpisah pada batas atas dan batas bawah agar hasil benar."],"correct":[0,1,2],"stimulus":"Dalam analisis biaya kumulatif, integral tentu digunakan untuk menjumlahkan kontribusi perubahan pada interval tertentu. Untuk menghitungnya, tentukan antiturunan lalu evaluasi F(2)−F(0). Tanda salah satu suku pada integran saja tidak menentukan tanda integral total.","illustration":{"kind":"formula","title":"Evaluasi integral","items":["F(x) = x³ − 2x² + 2x","F(2) = 4","F(0) = 0","F(2) − F(0) = 4"],"caption":"Integral tentu dihitung dari selisih nilai antiturunan pada batas."}},{"type":"single","prompt":"Dalam suatu kelas, nilai ujian memiliki rata-rata 78. Seorang siswa memperoleh 90 dan diketahui simpangan baku kelompok adalah 6. Dengan skor baku z=(x−μ)/σ, berapa skor baku siswa tersebut?","options":["−2","−1","1","2","3"],"correct":[3],"stimulus":"Guru ingin membandingkan posisi relatif siswa terhadap sebaran nilai kelas, bukan sekadar melihat selisih nilai mentah. Skor baku dihitung dari selisih antara nilai siswa dan rata-rata, kemudian dibagi simpangan baku. Nilai z positif menandakan skor berada di atas rata-rata.","illustration":{"kind":"formula","title":"Informasi statistik","items":["Nilai siswa: 90","Rata-rata: 78","Simpangan baku: 6","z = (90 − 78) / 6"],"caption":"Skor baku menyatakan jarak dari rata-rata dalam satuan simpangan baku."}},{"type":"multi","prompt":"Dua vektor perpindahan dinyatakan a=(3,4) dan b=(−4,3). Seorang siswa mengklaim bahwa kedua vektor saling tegak lurus. Pilih SEMUA pemeriksaan yang benar.","options":["Produk titik a·b bernilai 0.","Panjang a adalah 5.","Panjang b adalah 7.","Karena hasil kali komponen pertama negatif, vektor pasti sejajar.","Produk titik nol menunjukkan kedua vektor tegak lurus untuk vektor tak nol."],"correct":[0,1,4],"stimulus":"Pada simulasi robot, dua perpindahan dapat digambarkan sebagai vektor pada bidang koordinat. Hubungan tegak lurus dapat diperiksa melalui produk titik; panjang vektor dihitung dari akar jumlah kuadrat komponennya. Gunakan kedua cara tersebut untuk mengevaluasi klaim siswa.","illustration":{"kind":"vectors","title":"Dua vektor pada bidang koordinat","caption":"Kedua vektor digambarkan dari titik asal; hasil kali titiknya menentukan hubungan sudut."}},{"type":"single","prompt":"Sebuah survei memilih 3 orang dari 8 finalis secara acak untuk menjadi tim presentasi; urutan anggota tidak diperhatikan. Berapa banyak tim berbeda yang dapat dibentuk?","options":["24","56","112","336","512"],"correct":[1],"stimulus":"Panitia harus membentuk kelompok tiga orang dari delapan finalis. Tidak ada posisi ketua atau urutan tampil yang dibedakan, sehingga tim yang terdiri dari orang yang sama tetap dihitung satu kali meskipun urutan pemilihannya berbeda. Gunakan kombinasi, bukan permutasi.","illustration":{"kind":"formula","title":"Pemilihan tim tanpa urutan","items":["n = 8","r = 3","C(n,r) = n! / (r!(n−r)!)"],"caption":"Urutan tidak membedakan satu tim dari tim lain."}},{"type":"multi","prompt":"Sebuah perusahaan mengevaluasi model kuadrat y=−x²+6x−5 untuk menentukan titik tertinggi kurva. Pilih SEMUA pernyataan yang benar.","options":["Parabola membuka ke bawah.","Titik puncaknya berada di x=3.","Nilai maksimum fungsi adalah 4.","Fungsi meningkat untuk semua x>3.","Akar fungsi adalah x=1 dan x=5."],"correct":[0,1,2,4],"stimulus":"Model sederhana tersebut digunakan untuk menggambarkan hasil yang meningkat pada awalnya lalu menurun. Koefisien x² negatif, sehingga grafik membuka ke bawah. Gunakan koordinat titik puncak x=−b/(2a), substitusi untuk mendapatkan nilai maksimum, dan faktorkan fungsi untuk menemukan titik potong sumbu-x.","illustration":{"kind":"parabola","title":"Fungsi kuadrat","items":["y = −x² + 6x − 5","x puncak = −b/(2a)","y = −(x − 3)² + 4"],"caption":"Bentuk puncak memudahkan membaca maksimum dan lokasi puncak."}},{"type":"single","prompt":"Sebuah proyek memiliki dua jalur penyelesaian. Peluang jalur A selesai tepat waktu adalah 0,8 dan peluang jalur B tepat waktu adalah 0,7. Dengan asumsi kejadian independen, peluang keduanya selesai tepat waktu adalah …","options":["0,15","0,24","0,56","0,75","0,94"],"correct":[2],"stimulus":"Manajer proyek memantau dua alur kerja yang tidak saling bergantung. Proyek hanya masuk kategori “keduanya tepat waktu” apabila jalur A dan jalur B sama-sama selesai tepat waktu. Untuk kejadian independen, peluang irisan dihitung dengan mengalikan masing-masing peluang.","illustration":null},{"type":"multi","prompt":"Seorang siswa mengubah f(x)=2x+5 menjadi invers f⁻¹(x)=(x−5)/2. Pilih SEMUA cara yang benar untuk memeriksa invers tersebut.","options":["Tukar x dan y pada persamaan y=2x+5, lalu selesaikan untuk y.","Komposisi f(f⁻¹(x)) menghasilkan x.","Komposisi f⁻¹(f(x)) menghasilkan x.","Inversnya adalah 2x−5 karena tanda konstanta selalu dibalik.","Grafik fungsi dan inversnya saling merupakan pencerminan terhadap garis y=x."],"correct":[0,1,2,4],"stimulus":"Invers fungsi membalik pemetaan dari masukan ke keluaran. Selain menyelesaikan persamaan dengan menukar variabel, siswa bisa menguji komposisi dua arah dan memahami hubungan grafik dengan garis y=x. Pemeriksaan ini membantu menemukan kesalahan aljabar yang terlihat masuk akal tetapi tidak benar.","illustration":{"kind":"flow","title":"Pemeriksaan fungsi invers","items":["Tukar x dan y","Selesaikan untuk y","Uji f(f⁻¹(x)) dan f⁻¹(f(x))"],"caption":"Kedua komposisi harus kembali ke x pada domain yang sesuai."}}]};

function loadState(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw){const fresh=defaultState();localStorage.setItem(STORE_KEY,JSON.stringify(fresh));return fresh;}const d=JSON.parse(raw);const loaded={...defaultState(),...d,proctor:{...defaultState().proctor,...d.proctor},settings:{...defaultState().settings,...d.settings},students:Array.isArray(d.students)?d.students:[],results:Array.isArray(d.results)?d.results:[],integrityAlerts:Array.isArray(d.integrityAlerts)?d.integrityAlerts:[],completionAlerts:Array.isArray(d.completionAlerts)?d.completionAlerts:[]};let migrated=false;const used=new Set();for(const student of loaded.students){if(!Number.isFinite(Number(student.integrityStrikes))){student.integrityStrikes=0;migrated=true;}if(typeof student.permanentlyBlocked!=='boolean'){student.permanentlyBlocked=false;migrated=true;}if(!/^TK\d{8}$/.test(String(student.username||''))||used.has(student.username)){student.username=randUsername([...used]);migrated=true;}used.add(student.username);if(!/^\d{8}\*$/.test(String(student.password||''))){student.password=randPassword();migrated=true;}}if(migrated){for(const result of loaded.results){const student=loaded.students.find(x=>x.id===result.studentId);if(student)result.username=student.username;}localStorage.setItem(STORE_KEY,JSON.stringify(loaded));}return loaded;}catch(e){return defaultState();}}

/div><div class="copyright">© ${new Date().getFullYear()} Ruang Ujian · Dibuat untuk kebutuhan pembelajaran</div></div></section></div>`}

ass="date-chip">${icons.calendar} &nbsp; ${fmtDate(todayKey())}</div><div class="profile-menu-wrap"><button type="button" class="profile profile-trigger" id="profileMenuToggle" aria-expanded="${profileMenuOpen}" aria-label="Menu profil proktor"><span class="avatar">${avatar}</span><span><span class="profile-name">${esc(p.name)}</span><span class="profile-role">● Proktor aktif</span></span><span class="profile-chevron">${icons.chevron}</span></button>${profileMenuOpen?`<div class="profile-dropdown" role="menu"><button type="button" data-profile-action="settings" role="menuitem">${icons.settings}<span>Settings</span></button><div class="profile-dropdown-divider"></div><button type="button" class="dropdown-danger" data-profile-action="logout" role="menuitem">${icons.logout}<span>Keluar</span></button></div>`:''}</div></div></header><main class="main-content">${renderSection()}</main></div></div>`}

function playTone(ctx,frequency=880,duration=.22,volume=.55){try{if(!ctx)return;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=frequency;gain.gain.setValueAtTime(volume,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+duration);}catch(e){}}
function startStudentAlarm(){clearInterval(integrityAlarmInterval);const tick=()=>{if(!integrityViolationActive)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(AC&&!examAudioContext)examAudioContext=new AC();examAudioContext?.resume?.();playTone(examAudioContext,880,.25,.8);setTimeout(()=>playTone(examAudioContext,660,.24,.8),260);}catch(e){}};tick();integrityAlarmInterval=setInterval(tick,950);}
function prepareProctorAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(AC&&!proctorAudioContext)proctorAudioContext=new AC();if(proctorAudioContext?.state==='suspended')proctorAudioContext.resume()?.catch?.(()=>{});}catch(e){}}

function processNewIntegrityAlerts(nextState){const alerts=nextState.integrityAlerts||[];const fresh=alerts.filter(a=>a?.id&&!knownIntegrityAlertIds.has(a.id));if(mode!=='proctor')return false;alerts.forEach(a=>{if(a?.id)knownIntegrityAlertIds.add(a.id)});if(fresh.length){playProctorAlertSound();fresh.forEach(a=>toast(`Peringatan: ${a.name} (${a.username}) keluar dari lembar ujian.`,'error'));return true;}return false;}

function renderIntegrityOverlay(){let overlay=document.getElementById('integrityWarningOverlay');if(!overlay){overlay=document.createElement('div');overlay.id='integrityWarningOverlay';overlay.className='integrity-overlay';overlay.setAttribute('role','alertdialog');overlay.setAttribute('aria-modal','true');overlay.innerHTML=`<section class="integrity-dialog"><div class="integrity-stripe"></div><div class="integrity-dialog-body"><div class="integrity-symbol">${icons.alert}</div><div class="integrity-eyebrow">Peringatan integritas ujian</div><h2>Anda meninggalkan lembar ujian</h2><p>Aktivitas berpindah tab atau meninggalkan halaman ujian terdeteksi. Akun Anda telah dinonaktifkan sementara dan proktor sudah diberi peringatan. Kembali ke halaman login dalam:</p><div class="integrity-countdown" id="integrityCountdownNumber">10</div><p id="integrityCountdownCaption">Jangan tutup halaman ini. Proses akan berakhir otomatis.</p><p class="integrity-warning-note">Jika pelanggaran terjadi kembali setelah akun diaktifkan oleh proktor, akun akan diblokir permanen.</p></div></section>`;document.body.appendChild(overlay);}updateIntegrityCountdown();}
function updateIntegrityCountdown(){if(!integrityViolationActive)return;const remaining=Math.max(0,Math.ceil((integrityCountdownEndsAt-Date.now())/1000));const n=document.getElementById('integrityCountdownNumber');if(n)n.textContent=String(remaining);if(remaining<=0){forceLogoutAfterViolation();}}
function registerIntegrityViolation(reason='Lembar ujian ditinggalkan',showCountdown=true){if(mode!=='student'||!exam||!loggedStudentId||integrityViolationActive||integrityViolationInProgress)return;integrityViolationInProgress=true;const s=state.students.find(x=>x.id===loggedStudentId);if(!s){integrityViolationInProgress=false;return;}s.integrityStrikes=(Number(s.integrityStrikes)||0)+1;const permanent=s.integrityStrikes>=2;s.permanentlyBlocked=permanent;s.active=false;s.resetRequested=false;s.loginStatus=permanent?'Diblokir permanen':'Nonaktif · pelanggaran ujian';s.lastIntegrityViolationAt=new Date().toISOString();s.examStartedAt=null;const alert={id:uid('ALERT'),studentId:s.id,name:s.name,username:s.username,className:s.className||'',subject:exam.subject,reason,strike:s.integrityStrikes,permanent,at:s.lastIntegrityViolationAt,seen:false};state.integrityAlerts=Array.isArray(state.integrityAlerts)?state.integrityAlerts:[];state.integrityAlerts.unshift(alert);state.integrityAlerts=state.integrityAlerts.slice(0,100);saveState();if(showCountdown){integrityViolationActive=true;integrityCountdownEndsAt=Date.now()+10000;renderIntegrityOverlay();startStudentAlarm();clearInterval(integrityCountdownInterval);integrityCountdownInterval=setInterval(updateIntegrityCountdown,200);}integrityViolationInProgress=false;}
function forceLogoutAfterViolation(){if(!integrityViolationActive)return;const s=state.students.find(x=>x.id===loggedStudentId);const permanent=!!s?.permanentlyBlocked;clearIntegrityMonitor();exam=null;mode='login';loginRole='student';loggedStudentId=null;studentPage='verify';studentIdentityError='';loginSuccess='';loginError=permanent?'Akun Anda dinonaktifkan permanen karena pelanggaran saat ujian. Username ini tidak dapat digunakan kembali. Hubungi pihak sekolah.':'Username dinonaktifkan otomatis setelah terdeteksi keluar dari lembar ujian. Hubungi proktor untuk pemeriksaan dan aktivasi ulang.';activeSection='dashboard';render();}
function clearIntegrityMonitor(){clearInterval(integrityCountdownInterval);clearInterval(integrityAlarmInterval);integrityCountdownInterval=null;integrityAlarmInterval=null;integrityViolationActive=false;integrityViolationInProgress=false;integrityCountdownEndsAt=0;document.getElementById('integrityWarningOverlay')?.remove();}
function handleExamVisibilityChange(){if(document.visibilityState==='hidden'&&mode==='student'&&exam&&!integrityViolationActive){registerIntegrityViolation('Berpindah tab, meminimalkan, atau menyembunyikan halaman ujian',true);}else if(document.visibilityState==='visible'&&integrityViolationActive){updateIntegrityCountdown();}}

function renderDashboard(){const students=state.students,total=students.length,active=students.filter(s=>s.active&&!s.resetRequested).length,today=activeTodayResults(),ongoing=students.filter(s=>s.loginStatus==='Sedang ujian'&&s.examStartedAt&&Date.now()-new Date(s.examStartedAt).getTime()<(state.settings.duration+5)*60000).length,avg=today.length?Math.round(today.reduce((a,r)=>a+Number(r.score||0),0)/today.length):0;const waiting=students.filter(s=>s.resetRequested).length;return `<div class="stack"><div class="row-between" style="align-items:flex-end;flex-wrap:wrap"><div><h1 class="page-title">Dashboard</h1><p class="page-desc">Ringkasan aktivitas dan kondisi ujian hari ini.</p></div><div class="row"><span class="badge badge-green">${icons.check} Sistem aktif</span><button class="btn btn-secondary btn-sm" data-action="refreshDashboard">${icons.refresh} Perbarui</button></div></div>${renderIntegrityBanner()}<div class="kpi-grid"><div class="kpi"><div class="kpi-top"><div class="kpi-label">Total siswa</div><div class="kpi-icon">${icons.users}</div></div><div class="kpi-number" id="kpiTotal">${total}</div><div class="kpi-foot">Peserta dalam daftar</div></div><div class="kpi"><div class="kpi-top"><div class="kpi-label">Siswa aktif</div><div class="kpi-icon" style="background:#e7f7ef;color:#16835d">${icons.userCheck}</div></div><div class="kpi-number" id="kpiActive">${active}</div><div class="kpi-foot">Dapat masuk ujian</div></div><div class="kpi"><div class="kpi-top"><div class="kpi-label">Sedang mengerjakan</div><div class="kpi-icon" style="background:#fff4df;color:#b96b0d">${icons.clock}</div></div><div class="kpi-number" id="kpiOngoing">${ongoing}</div><div class="kpi-foot">Sesi dalam batas waktu</div></div><div class="kpi"><div class="kpi-top"><div class="kpi-label">Selesai hari ini</div><div class="kpi-icon" style="background:#f0eaff;color:#7042c8">${icons.check}</div></div><div class="kpi-number" id="kpiCompleted">${today.length}</div><div class="kpi-foot">Rata-rata nilai: ${avg}</div></div></div><div class="content-grid"><section class="card"><div class="card-head"><div><h2 class="section-title">Aktivitas ujian hari ini</h2><p>Perbandingan penyelesaian berdasarkan mata pelajaran.</p></div><span class="badge badge-blue">${fmtDate(todayKey())}</span></div><div class="chart-area"><canvas id="dashboardChart" aria-label="Grafik hasil ujian"></canvas></div><div class="notice" style="margin-top:5px">Grafik menampilkan hasil yang tersimpan pada browser ini. Pembaruan terjadi otomatis selama halaman proktor terbuka.</div></section><section class="card"><div class="card-head"><div><h2 class="section-title">Konfigurasi ujian</h2><p>Mata pelajaran yang saat ini ditampilkan kepada siswa.</p></div><button class="btn btn-soft btn-sm" data-section="settings">Ubah</button></div><div class="subject-row"><div class="subject-icon">${icons.book}</div><div class="subject-meta"><div class="subject-name">${esc(state.settings.subject)}</div><div class="subject-sub">${state.settings.duration} menit · 20 soal</div></div><span class="badge badge-blue">Aktif</span></div><div class="subject-row"><div class="subject-icon">${icons.key}</div><div class="subject-meta"><div class="subject-name">Token ujian</div><div class="subject-sub">Diperbarui ${fmtTime(state.tokenUpdatedAt)}</div></div><span class="code">${esc(state.token)}</span></div><div class="subject-row"><div class="subject-icon">${icons.refresh}</div><div class="subject-meta"><div class="subject-name">Permintaan reset</div><div class="subject-sub">Perlu persetujuan proktor</div></div><strong class="subject-value">${waiting}</strong></div><button class="btn btn-primary btn-block" style="margin-top:14px" data-section="students">Kelola Data Siswa ${icons.users}</button></section></div><section class="card"><div class="card-head"><div><h2 class="section-title">Penyelesaian terbaru</h2><p>Hasil siswa yang berhasil mengirim ujian.</p></div><button class="btn btn-secondary btn-sm" data-section="results function updateDashboardNumbers(){if(mode!=='proctor'||activeSection!=='dashboard')return;const s=state.students,t=activeTodayResults(),o=s.filter(x=>x.loginStatus==='Sedang ujian'&&x.examStartedAt&&Date.now()-new Date(x.examStartedAt).getTime()<(state.settings.duration+5)*60000).length;const vals={kpiTotal:s.length,kpiActive:s.filter(x=>x.active&&!x.resetRequested).length,kpiOngoing:o,kpiCompleted:t.length};Object.entries(vals).forEach(([id,v])=>{const el=document.getElementById(id);if(el)el.textContent=v;});}
function drawChart(){const canvas=$('#dashboardChart');if(!canvas)return;const rect=canvas.getBoundingClientRect();if(!rect.width||!rect.height)return;const scale=window.devicePixelRatio||1;canvas.width=rect.width*scale;canvas.height=rect.height*scale;const c=canvas.getContext('2d');c.scale(scale,scale);const w=rect.width,h=rect.height;const pad={l:34,r:10,t:12,b:34},pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;c.clearRect(0,0,w,h);const max=Math.max(5,...SUBJECTS.map(s=>activeTodayResults().filter(r=>r.subject===s).length));c.font='10px system-ui';c.textBaseline='middle';for(let i=0;i<=4;i++){let y=pad.t+ph-i*ph/4;c.strokeStyle='#edf1f6';c.lineWidth=1;c.beginPath();c.moveTo(pad.l,y);c.lineTo(w-pad.r,y);c.stroke();c.fillStyle='#96a2b5';c.textAlign='right';c.fillText(String(Math.round(max*i/4)),pad.l-8,y)}const vals=SUBJECTS.map(s=>activeTodayResults().filter(r=>r.subject===s).length),groupW=pw/3,bw=Math.min(42,groupW*.38);const colors=['#3778ed','#28a879','#9169e8'];vals.forEach((v,i)=>{const x=pad.l+groupW*i+groupW/2-bw/2;const bh=v/max*ph;const y=pad.t+ph-bh;c.fillStyle=colors[i];roundRect(c,x,y,bw,Math.max(2,bh),7);c.fill();c.fillStyle='#34445d';c.textAlign='center';c.font='bold 11px system-ui';c.fillText(String(v),x+bw/2,Math.max(8,y-10));c.fillStyle='#77849a';c.font='10px system-ui';c.fillText(['B. Indonesia','B. Inggris','Matematika'][i],x+bw/2,h-13);});}

function showConfirmModal({title='Konfirmasi tindakan',subtitle='Pastikan pilihan Anda',message='Apakah Anda yakin ingin melanjutkan?',detail='',icon=icons.alert||icons.shield,confirmLabel='Ya, lanjutkan',cancelLabel='Batal',requireText='',captcha=false,onConfirm=()=>{}}={}){

function handleAction(action,id,index){switch(action){case'clearIntegrityAlerts':{const count=(state.integrityAlerts||[]).length;if(!count){toast('Tidak ada notifikasi untuk dihapus.');break;}showConfirmModal({title:'Hapus semua notifikasi peringatan?',subtitle:'Konfirmasi penghapusan riwayat',message:`Semua ${count} notifikasi pada menu Peringatan akan dihapus.`,detail:'Tindakan ini hanya menghapus riwayat notifikasi. Status akun siswa dan pemblokiran permanen tidak berubah.',icon:icons.trash,confirmLabel:'Ya, hapus semua',cancelLabel:'Batal',requireText:'HAPUS',onConfirm:()=>{state.integrityAlerts=[];knownIntegrityAlertIds.clear();saveState();render();toast('Semua notifikasi peringatan berhasil dihapus.');}});break;}case'viewIntegrityStudent':{const st=state.students.find(x=>x.id===id);if(st){activeSection='students';searchTerm=st.username;(state.integrityAlerts||[]).forEach(a=>{if(a.studentId===id)a.seen=true});saveState();render();}break;}case'addStudent':openStudentModal();break;case'editStudent':{const existing=state.students.find(x=>x.id===id);if(existing?.permanentlyBlocked){toast('Akun diblokir permanen dan tidak dapat diedit.','error');break;}openStudentModal(id);break;}case'toggleStudent':{const s=state.students.find(x=>x.id===id);if(!s)return;if(s.permanentlyBlocked){toast('Akun ini diblokir permanen dan tidak dapat diaktifkan kembali.','error');break;}s.active=!s.active;if(!s.active)s.loginStatus='Nonaktif';else if(!s.resetRequested)s.loginStatus='Aktif';saveState();render();toast(`Status ${s.name} diperbarui.`);break;}case'deleteStudent':{const s=state.students.find(x=>x.id===id);if(s)showConfirmModal({title:'Hapus data siswa?',subtitle:'Tindakan permanen',message:`Akun ${s.name} akan dihapus dari daftar Data Siswa.`,detail:'Hasil ujian siswa ini tidak ikut dihapus dan tetap tersedia pada menu Hasil Ujian. Tindakan ini tidak dapat dibatalkan. Selesaikan CAPTCHA untuk memastikan penghapusan disengaja.',icon:icons.trash,confirmLabel:'Ya, hapus siswa',can
