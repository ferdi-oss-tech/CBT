function openStudentModal(id=null){editingStudentId=id;const s=id?state.students.find(x=>x.id===id):null;const usedUsernames=state.students.filter(x=>x.id!==id).map(x=>x.username);const username=(s?.username&&/^TK\d{8}$/.test(s.username))?s.username:randUsername(usedUsernames);const password=s?.password||randPassword();$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><h2>${s?'Edit Data Siswa':'Tambah Siswa'}</h2><p>Lengkapi informasi dasar dan kredensial untuk login ujian.</p></div><button class="icon-btn" data-modal-close>${icons.close}</button></div><form id="studentForm"><div class="modal-body"><div class="form-grid"><div class="field span-2"><label>Nama lengkap *</label><input id="formName" required maxlength="120" value="${esc(s?.name||'')}" placeholder="Nama lengkap siswa"></div><div class="field"><label>Username * (TK + 8 angka)</label><input id="formUsername" required maxlength="10" minlength="10" pattern="TK[0-9]{8}" oninput="this.value=this.value.toUpperCase()" value="${esc(username)}"><span class="label-hint">Diawali TK kapital, lalu 8 angka acak. Contoh: TK12345678.</span></div><div class="field"><label>Password * (8 angka + *)</label><input id="formPassword" required pattern="[0-9]{8}\\*" value="${esc(password)}"><span class="label-hint">Contoh: 12345678*</span></div><div class="field"><label>Kelas *</label><input id="formClass" required maxlength="40" value="${esc(s?.className||'')}" placeholder="Contoh: XI MP 1"></div><div class="field"><label>Tanggal lahir *</label><input type="date" id="formBirth" required value="${esc(s?.birthDate||'')}"></div><div class="field span-2"><label>Nama sekolah</label><input id="formSchool" maxlength="150" value="${esc(s?.school||state.settings.school||'')}" placeholder="Nama sekolah"></div><div class="field"><label>Status akun</label><select id="formActive"><option value="true" ${s?.active!==false?'selected':''}> function exportCredentialsExcel(){const rows=[['Nama Lengkap','Username','Password','Kelas','Nama Sekolah','Tanggal Lahir','Status'],...state.students.map(s=>[s.name,s.username,s.password,s.className,s.school,s.birthDate,s.active?'Aktif':'Nonaktif'])];if(window.XLSX){const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:28},{wch:14},{wch:14},{wch:14},{wch:28},{wch:16},{wch:12}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Kredensial Siswa');XLSX.writeFile(wb,`kredensial_siswa_${todayKey()}.xlsx`);}else downloadBlob(csvBlob(rows),`kredensial_siswa_${todayKey()}.csv`);toast('Ekspor kredensial disiapkan.','good');}

function exportCredentialsPDF(){if(!state.students.length){toast('Belum ada data siswa untuk diekspor.','error');return;}if(window.jspdf?.jsPDF){const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});doc.setFont('helvetica','bold');doc.setFontSize(17);doc.text('KREDENSIAL AKUN SISWA',14,17);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(`Ruang Ujian • ${state.settings.school||'Sekolah'} • ${fmtDate(todayKey())}`,14,24);doc.setFontSize(8);doc.text('Simpan dokumen ini secara aman. Bagikan kartu hanya kepada siswa yang bersangkutan.',14,30);let y=39;state.students.forEach((s,i)=>{const x=14,w=182,h=27;if(y+h>282){doc.addPage();y=18;}doc.setDrawColor(200,211,228);doc.setFillColor(248,250,254);doc.roundedRect(x,y,w,h,3,3,'FD');doc.setTextColor(25,49,85);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text(`${i+1}. ${s.name}`,x+5,y+7);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text(`Kelas: ${s.className||'-'}   |   Tanggal lahir: ${s.birthDate||'-'}`,x+5,y+13);doc.setFont('courier','bold');doc.setFontSize(9);doc.text(`Username: ${s.username}     Password: ${s.password}`,x+5,y+20);doc.setFont('helvetica','normal');doc.setFontSize(7);doc.text(`Status akun: ${s.active?'Aktif':'Nonaktif'}`,x+5,y+25);y+=h+4;});doc.save(`kredensial_siswa_${todayKey()}.pdf`);}else{toast('Library PDF belum tersedia. Gunakan tombol Kartu siswa lalu Cetak > Simpan sebagai PDF.','error');printCards();}}
function printCards(){if(!state.students.length){toast('Belum ada data siswa untuk dicetak.','error');return;}const win=window.open('','_blank');if(!win){toast('Izinkan pop-up untuk mencetak kartu siswa.','error');return;}win.document.write(`<!doctype html><html><head><title>Kartu Kredensial Siswa</title><meta charset="utf-8"><style>body{font:13px Arial;color:#18253a;margin:22px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #cad4e3;border-radius:12px;padding:16px;break-inside:avoid}.top{display:flex;justify-content:space-between;border-bottom:1px solid #e5eaf2;padding-bottom:9px;margin-bottom:10px}.label{font-size:10px;color:#63728b}.name{font-size:15px;font-weight:bold;margin:0 0 5px}.code{font: bold 13px monospace;letter-spacing:.5px;background:#f2f5fa;padding:8px;border-radius:6px;margin-top:5px}.foot{font-size:9px;color:#63728b;margin-top:9px}@media print{button{display:none}.cards{gap:8px}}</style></head><body><button onclick="window.print()">Cetak / Simpan PDF</button><div class="cards">${state.students.map(s=>`<div class="card"><div class="top"><strong>RUANG UJIAN · CBT</strong><span class="label">KREDENSIAL SISWA</span></div><p class="name">${esc(s.name)}</p><div class="label">Kelas: ${esc(s.className||'-')}</div><div class="code">Username: ${esc(s.username)}</div><div class="code">Password: ${esc(s.password)}</div><div class="foot">${esc(s.school||state.settings.school||'Sekolah')} · Status: ${s.active?'Aktif':'Nonaktif'}<br>Jaga kerahasiaan username dan password.</div></div>`).join('')}</div><script>setTimeout(()=>window.print(),350)<\/script></body></html>`);win.document.close();}
async function handleImport(e){const file=e.target.files?.[0];if(!file)return;try{let rows;if(window.XLSX){const data=await file.arrayBuffer();const wb=XLSX.read(data,{type:'array',cellDates:false});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});}else if(file.name.toLowerCase().endsWith('.csv')){const text=await file.text();rows=parseCSV(text);}else{throw new Error('Pembaca Excel tidak tersedia. Buka koneksi internet atau gunakan file CSV.');}const normalized=normalizeImport(rows);if(!normalized.length)throw new Error('Tidak ditemukan baris siswa. Pastikan file memiliki kolom Nama Lengkap dan Kelas.');importPreview=normalized;openImportPreview(normalized,file.name);}catch(err){toast(err.message||'File tidak dapat dibaca.','error')}finally{e.target.value='';}}
function parseCSV(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());const parse=line=>{const arr=[];let cur='',quoted=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'&&quoted){cur+='"';i++;}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){arr.push(cur);cur='';}else cur+=c;}arr.push(cur);return arr};const headers=parse(lines.shift()).map(x=>x.trim());return lines.map(line=>Object.fromEntries(parse(line).map((v,i)=>[headers[i]||`col${i}`,v.trim()])))}
function normKey(s){return String(s||'').toLowerCase().replace(/[ _-]/g,'').replace(/[^a-z0-9]/g,'')}
function normalizeImport(rows){const out=[];const keys=Object.keys(rows[0]||{});const find=(row,aliases)=>{const ent=Object.entries(row).find(([k,v])=>aliases.includes(normKey(k)));return ent?String(ent[1]??'').trim():''};rows.forEach(r=>{let name=find(r,['namalengkap','nama','namasiswa','name','fullname']);if(!name||name.toLowerCase().startsWith('catatan:'))return;let username=find(r,['username','userid','akun']);let password=find(r,['password','kata sandi','katasandi','sandi']);let className=find(r,['kelas','class','className'.toLowerCase()]);let school=find(r,['namasekolah','sekolah','school'])||state.settings.school;let birthDate=find(r,['tanggallahir','tgllahir','birthdate','dob']);let status=find(r,['status','aktif','active']).toLowerCase();if(!/^\d{4}-\d{2}-\d{2}$/.test(birthDate)){const m=birthDate.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(m)birthDate=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}out.push({name,username,password,className,school,birthDate,active:!['nonaktif','non active','inactive','false','0','tidak','no'].includes(status)});});return out;}
function openImportPreview(rows,filename){const existing=rows.length;$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><h2>Pratinjau impor Excel</h2><p>File: ${esc(filename)} · ${existing} baris dikenali.</p></div><button class="icon-btn" data-modal-close>${icons.close}</button></div><div class="modal-body"><div class="notice">Baris yang belum memiliki username/password valid akan dibuatkan kredensial otomatis. Username duplikat akan diganti agar tetap unik.</div><div class="table-wrap" style="margin-top:14px"><table style="min-width:600px"><thead><tr><th>Nama</th><th>Username</th><th>Kelas</th><th>Status</th></tr></thead><tbody>${rows.slice(0,10).map(r=>`<tr><td>${esc(r.name)}</td><td class="code">${esc(r.username||'(otomatis)')}</td><td>${esc(r.className||'-')}</td><td>${r.active?'Aktif':'Nonaktif'}</td></tr>`).join('')}</tbody></table></div>${rows.length>10?`<p class="small muted">10 baris pertama ditampilkan. Total baris: ${rows.length}.</p>`:''}</div><div class="modal-foot"><button class="btn btn-secondary" data-modal-close>Batal</button><button class="btn btn-primary" id="confirmImport">${icons.check} Impor ${existing} siswa</button></div></section></div>`;$$('[data-modal-close]').forEach(b=>b.onclick=closeModal);$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});$('#confirmImport').onclick=()=>commitImport(rows);}
function commitImport(rows){let added=0,updated=0;const usernames=new Set(state.students.map(s=>s.username));for(const r of rows){let username=String(r.username||'').trim().toUpperCase(),password=r.password;if(!/^TK\d{8}$/.test(username)||usernames.has(username))username=randUsername([...usernames]);usernames.add(username);if(!/^\d{8}\*$/.test(password))password=randPassword();let existing=state.students.find(s=>s.name.toLowerCase()===r.name.toLowerCase()&&s.className===r.className);if(existing){const permanentlyBlocked=!!existing.permanentlyBlocked;Object.assign(existing,{name:r.name,username:permanentlyBlocked?existing.username:username,password,className:r.className||existing.className,school:r.school||existing.school,birthDate:r.birthDate||existing.birthDate,active:permanentlyBlocked?false:r.active,permanentlyBlocked,loginStatus:permanentlyBlocked?'Diblokir permanen':r.active?'Aktif':'Nonaktif'});updated++;}else{state.students.push({id:uid('SIS'),name:r.name,username,password,className:r.className||'',school:r.school||'',birthDate:r.birthDate||'',active:r.active,resetRequested:false,loginStatus:r.active?'Aktif':'Nonaktif',integrityStrikes:0,permanentlyBlocked:false,createdAt:new Date().toISOString(),score:null,lastSubject:null,completedAt:null,attempts:0});added++;}}saveState();closeModal();searchTerm='';render();toast(`Impor selesai: ${added} siswa baru, ${updated} diperbarui.`);}
function exportResults(){const rows=[['Nama Lengkap','Username','Kelas','Sekolah','Mata Pelajaran','Jawaban Benar','Jumlah Soal','Nilai','Tanggal Selesai','Waktu Selesai'],...state.results.slice().sort((a,b)=>new Date(b.completedAt)-new Date(a.completedAt)).map(r=>[r.name,r.username,r.className,r.school,r.subject,r.correct,r.total,r.score,fmtDate(r.completedAt),fmtTime(r.completedAt)])];if(window.XLSX){const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:25},{wch:15},{wch:14},{wch:25},{wch:20},{wch:15},{wch:12},{wch:10},{wch:18},{wch:15}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Hasil Ujian');XLSX.writeFile(wb,`hasil_ujian_${todayKey()}.xlsx`);}else downloadBlob(csvBlob(rows),`hasil_ujian_${todayKey()}.csv`);toast('Ekspor nilai disiapkan.');}
function approveReset(id){const s=state.students.find(x=>x.id===id);if(!s)return;if(s.permanentlyBlocked){toast('Akun diblokir permanen. Reset tidak dapat mengaktifkannya kembali.','error');return;}if(!confirm(`Setujui reset login untuk ${s.name}? Password akan diganti dan token ujian diperbarui.`))return;s.password=randPassword();s.active=true;s.resetRequested=false;s.resetAt=null;s.loginStatus='Aktif';s.examStartedAt=null;state.token=randToken();state.tokenUpdatedAt=new Date().toISOString();saveState();activeSection='students';render();openResetResult(s);}
function openResetResult(s){$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><h2>Reset login disetujui</h2><p>Akun ${esc(s.name)} telah aktif kembali.</p></div><button class="icon-btn" data-modal-close>${icons.close}</button></div><div class="modal-body"><div class="notice success">Username tetap. Password baru telah dibuat; token ujian juga telah diperbarui menjadi <strong>${esc(state.token)}</strong>.</div><div class="field" style="margin-top:16px"><label>Username siswa</label><input readonly value="${esc(s.username)}"></div><div class="field" style="margin-top:12px"><label>Password baru</label><input readonly value="${esc(s.password)}"></div><div class="field" style="margin-top:12px"><label>Token baru (berlaku untuk semua siswa)</label><input readonly value="${esc(state.token)}"></div><div class="small muted" style="margin-top:12px">Salin atau ekspor kredensial baru dan bagikan secara pribadi kepada siswa.</div></div><div class="modal-foot"><button class="btn btn-secondary" data-modal-close>Tutup</button><button class="btn btn-primary" id="copyNewCredentials">Salin kredensial</button></div></section></div>`;$$('[data-modal-close]').forEach(b=>b.onclick=closeModal);$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});$('#copyNewCredentials').onclick=()=>{const text=`Nama: ${s.name}\nUsername: ${s.username}\nPassword: ${s.password}\nToken: ${state.token}`;navigator.clipboard?.writeText(text).then(()=>toast('Kredensial disalin.')).catch(()=>prompt('Salin kredensial:',text));};}
function submitResetRequest(id){const s=state.students.find(x=>x.id===id);if(!s)return;if(s.permanentlyBlocked){toast('Akun diblokir permanen dan tidak dapat meminta reset.','error');return;}s.resetRequested=true;s.active=false;s.resetAt=new Date().toISOString();s.loginStatus='Reset diminta';saveState();toast('Permintaan reset dikirim ke proktor.');logout();}
function submitResetRequestByLogin(username){const s=state.students.find(x=>x.username===username);if(s?.permanentlyBlocked){loginError='Akun ini diblokir permanen dan tidak dapat mengajukan reset login.';loginSuccess='';render();return;}if(!s){toast('Akun siswa tidak ditemukan.','error');return;}s.resetRequested=true;s.active=false;s.resetAt=new Date().toISOString();s.loginStatus='Reset diminta';saveState();loginError='Permintaan reset telah dikirim. Tunggu persetujuan proktor.';loginSuccess='';render();toast('Permintaan reset tercatat di browser ini.');}
function verifyStudent(e){e.preventDefault();const s=state.students.find(x=>x.id===loggedStudentId);if(!s)return;const name=$('#identityName').value.trim().toLocaleLowerCase('id-ID'),dob=$('#identityDob').value,token=$('#identityToken').value.trim().toUpperCase();if(name!==String(s.name).trim().toLocaleLowerCase('id-ID')){studentIdentityError='Nama lengkap tidak sesuai dengan data siswa.';render();return;}if(!s.birthDate||dob!==s.birthDate){studentIdentityError='Tanggal lahir tidak sesuai atau belum diisi pada data siswa. Hubungi proktor.';render();return;}if(token!==state.token){studentIdentityError='Token tidak sesuai atau sudah kedaluwarsa. Periksa token terbaru dari proktor.';render();return;}if(!s.active||s.resetRequested){logout();loginError='Akun siswa tidak aktif. Hubungi proktor.';render();return;}studentIdentityError='';studentPage='ready';render();}
function startExam(){const s=state.students.find(x=>x.id===loggedStudentId);if(!s||!s.active||s.permanentlyBlocked){logout();return;}try{const AC=window.AudioContext||window.webkitAudioContext;if(AC&&!examAudioContext)examAudioContext=new AC();examAudioContext?.resume?.();}catch(e){}integrityViolationActive=false;integrityViolationInProgress=false;integrityCountdownEndsAt=0;clearInterval(integrityCountdownInterval);clearInterval(integrityAlarmInterval);exam={studentId:s.id,subject:state.settings.subject,startedAt:Date.now(),endsAt:Date.now()+Number(state.settings.duration||30)*60000,answers:{},flagged:[]};currentQuestion=0;studentPage='exam';s.loginStatus='Sedang ujian';s.examStartedAt=new Date().toISOString();s.lastSubject=exam.subject;saveState();render();}
function updateTimer(){if(!exam||mode!=='student')return;const left=Math.max(0,exam.endsAt-Date.now()),mins=Math.floor(left/60000),secs=Math.floor(left%60000/1000),formatted=`${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;const el=$('#timerDisplay');if(el){el.innerHTML=`${icons.clock} <span>${formatted}</span>`;el.classList.toggle('danger',left<=5*60000);}const de=$('#decisionTimer');if(de)de.textContent=formatted;if(left<=0){clearInterval(timerInterval);submitExam(true);}}
function submitExam(auto=false){if(!exam)return;const s=state.students.find(x=>x.id===loggedStudentId);if(!s)return;const qs=questions[exam.subject]||questions[SUBJECTS[0]];let correct=0;qs.forEach((q,i)=>{const raw=exam.answers[i];const chosen=Array.isArray(raw)?raw.slice().sort((a,b)=>a-b):(raw===undefined?[]:[raw]);const key=(q.correct||[]).slice().sort((a,b)=>a-b);if(chosen.length===key.length&&key.every((v,j)=>v===chosen[j]))correct++;});const completedAt=new Date().toISOString();const result={id:uid('RES'),studentId:s.id,name:s.name,username:s.username,className:s.className||'',school:s.school||state.settings.school||'',subject:exam.subject,correct,total:qs.length,score:Math.round(correct/qs.length*100),completedAt,startedAt:new Date(exam.startedAt).toISOString(),durationSeconds:Math.round((Date.now()-exam.startedAt)/1000),autoSubmitted:auto,answers:{...exam.answers},attemptNo:(s.attempts||0)+1};state.results.push(result);state.completionAlerts=Array.isArray(state.completionAlerts)?state.completionAlerts:[];state.completionAlerts.push({id:uid('DONE'),studentId:s.id,name:s.name,username:s.username,className:s.className||'',subject:result.subject,completedAt,score:result.score,autoSubmitted:auto});s.score=result.score;s.lastSubject=result.subject;s.completedAt=completedAt;s.loginStatus='Selesai';s.examStartedAt=null;s.attempts=(s.attempts||0)+1;studentLastResultId=result.id;clearIntegrityMonitor();exam=null;studentPage='done';saveState();render();if(auto)toast('Waktu habis. Jawaban dikirim otomatis.');}
function saveProctorAccount(e){e.preventDefault();const current=$('#currentProctorPassword').value,newUsername=$('#newProctorUsername').value.trim(),newPassword=$('#newProctorPassword').value,confirmPassword=$('#confirmProctorPassword').value;if(current!==state.proctor.password){alert('Password saat ini tidak sesuai. Perubahan tidak disimpan.');return;}if(!/^(?=.*[0-9])(?=.*[!@#$%&?])[0-9!@#$%&?]{8}$/.test(newUsername)){alert('Username harus tepat 8 karakter, terdiri dari angka dan sedikitnya satu simbol (! @ # $ % & ?).');return;}if(!/^\d{8}\*$/.test(newPassword)){alert('Password baru harus terdiri dari 8 angka diikuti tanda *.');return;}if(newPassword!==confirmPassword){alert('Konfirmasi password baru tidak sama.');return;}state.proctor={...state.proctor,username:newUsername,password:newPassword};saveState();profileMenuOpen=false;render();toast('Kredensial akun proktor berhasil diperbarui. Gunakan username dan password baru pada login berikutnya.');}
function previewProctorPhoto(e){const file=e.target.files?.[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){alert('Format foto harus JPG, PNG, atau WebP.');e.target.value='';return;}if(file.size>1024*1024){alert('Ukuran foto maksimal 1 MB.');e.target.value='';return;}const reader=new FileReader();reader.onload=()=>{const el=$('#proctorPhotoPreview');if(el)el.innerHTML=`<img src="${esc(reader.result)}" alt="Pratinjau foto profil">`;};reader.onerror=()=>alert('Foto tidak dapat dibaca. Silakan coba file lain.');reader.readAsDataURL(file);}
function saveProctorProfile(e){e.preventDefault();const name=$('#proctorProfileName').value.trim(),file=$('#proctorPhoto').files?.[0];if(!name){alert('Nama tampilan tidak boleh kosong.');return;}const commit=(photo)=>{state.proctor={...state.proctor,name,photo:photo||state.proctor.photo||''};try{saveState();profileMenuOpen=false;render();toast('Profil proktor berhasil diperbarui.');}catch(err){alert('Profil tidak dapat disimpan. Coba gunakan foto yang lebih kecil.');}};if(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>1024*1024){alert('Foto harus berformat JPG, PNG, atau WebP dan maksimal 1 MB.');return;}const reader=new FileReader();reader.onload=()=>commit(String(reader.result||''));reader.onerror=()=>alert('Foto tidak dapat dibaca.');reader.readAsDataURL(file);}else commit(state.proctor.photo||'');}
function saveSettings(e){e.preventDefault();const duration=Number($('#duration').value);if(!Number.isInteger(duration)||duration<1||duration>300){alert('Durasi ujian harus berupa bilangan bulat antara 1 hingga 300 menit.');return;}state.settings.subject=$('#subjectSelect').value;state.settings.date=$('#examDate').value;state.settings.duration=duration;state.settings.school=$('#schoolName').value.trim()||'Nama Sekolah';saveState();render();toast('Pengaturan ujian tersimpan.');}
window.addEventListener('storage',e=>{if(e.key===STORE_KEY){const next=loadState();processNewIntegrityAlerts(next);processNewCompletionAlerts(next);state=next;if(mode==='proctor')render();}});
document.addEventListener('visibilitychange',handleExamVisibilityChange);
window.addEventListener('pagehide',handleExamPageHide);
window.addEventListener('pageshow',()=>{if(mode==='student'&&exam&&loggedStudentId){state=loadState();const activeStudent=state.students.find(x=>x.id===loggedStudentId);if(activeStudent&&(!activeStudent.active||activeStudent.permanentlyBlocked)){logout(activeStudent.permanentlyBlocked?'Akun Anda diblokir permanen akibat pelanggaran saat ujian.':'Akun dinonaktifkan karena terdeteksi keluar dari lembar ujian. Hubungi proktor untuk pemeriksaan.');}}});
window.addEventListener('resize',()=>{if(mode==='proctor'&&activeSection==='dashboard')drawChart()});
// Initial display
render();
